<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magi3Dviewer - Magia Exedra 3D model viewer online | 圆哆啦角色模型查看器</title>
    <meta name="description" content="Magia Exedra 3D model viewer | 圆哆啦角色模型查看器">
    <meta name="keywords" content="Puella Magi Madoka Magica, Madoka Magica, Magia Exedra, Madoka Exedra, Magia Record, 3D Models, Three.js, 魔法少女小圆, 圆哆啦, 魔法纪录, 角色模型, 3D模型, 解包">
    <meta name="author" content="浩劫者12345">
</head>

<body>
    <div id="app">
        <div id="viewer"></div>

        <div id="stat">
            <span class="demo">Demo screenshot. Please wait for the character to load...</span>
            <div style="text-align: center;">
                <span id="load-progress"></span>
            </div>
        </div>

        <img id="demo-screenshot" class="demo" src="/src/demo.jpg" alt="Demo Screenshot">

        <div id="menu">
            <div id="menu-controls">
                <div>
                    Model: <select id="character-selector" class="target-true"></select>
                    <span class="target-false">&lt;No target selected&gt;</span>
                    <button id="character-add-plus-btn" title="Add model">➕</button>
                    <button id="character-add-cross-btn" class="target-true" title="Remove selected model">❌</button>
                </div>

                <div>
                    Animation: <select id="animation-selector" class="target-true"></select>
                    <button id="animation-play" class="target-true">Play</button>
                    <button id="animation-loop" class="target-true">Loop</button>
                    <button id="animation-stop" class="target-true">Stop</button>
                    <span class="target-false">&lt;No target selected&gt;</span>
                </div>

                <form id="theme-selector">
                    Theme:
                    <label>
                        <input type="radio" name="theme" value="light" />Light
                    </label>
                    <label>
                        <input type="radio" name="theme" value="dark" checked />Dark
                    </label>
                    <button id="fullscreen-btn">Fullscreen</button>
                </form>

                <div id="three-gui"></div>
            </div>

            <div id="menu-links">
                <a href="https://github.com/haojiezhe12345/Magi3Dviewer" target="_blank"><img src="/src/github-mark-white.svg"></a>
            </div>
        </div>

        <div id="character-add" style="display: none;">
            <div>
                <div>Add character:</div>
                <select id="character-add-selector"></select>
            </div>
            <div style="text-align: center;">
                <button id="character-add-ok">Add</button>
                <button id="character-add-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
