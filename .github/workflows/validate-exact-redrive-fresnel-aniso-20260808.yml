name: Validate exact ReDrive Fresnel Aniso MatCap

on:
  push:
    branches:
      - feature/exact-redrive-fresnel-aniso-20260808
    paths:
      - automation/trigger-exact-redrive-fresnel-aniso-20260808.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/exact-redrive-fresnel-aniso-20260808
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply fail-closed current-JP ReDrive formula patch
        run: python3 scripts/apply_exact_redrive_formula_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Exact formula source gate
        run: node exactReDriveFormulaParity.test.mjs

      - name: Existing official material profile gate
        run: node officialMaterialFresnelAniso.test.mjs

      - name: Existing native self-shadow gate
        run: node nativeSelfShadow.test.mjs

      - name: Production build
        run: npm run build

      - name: Persist validated runtime changes
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            magia-exedra-character-three/shaders/general.ts \
            magia-exedra-character-three/shaders/stylization.ts \
            magia-exedra-character-three/shaders/gem.ts
          if git diff --cached --quiet; then
            echo 'No runtime changes to persist.'
            exit 0
          fi
          git commit -m 'feat: port exact JP ReDrive Fresnel Aniso MatCap formulas'
          git push origin HEAD:feature/exact-redrive-fresnel-aniso-20260808
