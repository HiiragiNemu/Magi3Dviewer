name: Map Taiwan IL2CPP string addresses
run-name: Resolve domain SDK URL and signing-salt slots

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/tw-il2cpp-string-addresses.yml'
      - 'analysis-requests/tw-il2cpp-string-addresses.txt'

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Download and unpack Taiwan client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip
          python -m pip install --disable-pip-version-check pyelftools
          mkdir -p work/source work/xapk work/unpacked work/report
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/tw.sonet.magiaexedra?version=latest' \
            -o work/source/client.xapk
          sha256sum work/source/client.xapk > work/report/xapk-sha256.txt
          unzip -q work/source/client.xapk -d work/xapk
          while IFS= read -r -d '' apk; do unzip -q -o "$apk" -d work/unpacked; done \
            < <(find work/xapk -type f -name '*.apk' -print0 | sort -z)
          test -s work/unpacked/lib/arm64-v8a/libil2cpp.so
          test -s work/unpacked/assets/bin/Data/Managed/Metadata/global-metadata.dat
      - name: Decode relocated post-v27 metadata usage slots
        shell: python
        run: |
          from pathlib import Path
          import json,struct
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          binary_path=Path('work/unpacked/lib/arm64-v8a/libil2cpp.so')
          metadata_path=Path('work/unpacked/assets/bin/Data/Managed/Metadata/global-metadata.dat')
          metadata=metadata_path.read_bytes()
          magic,version=struct.unpack_from('<II',metadata,0)
          assert magic==0xFAB11BAF
          literal_offset,literal_size,literal_data_offset,literal_data_size=struct.unpack_from('<IIII',metadata,8)
          literal_records=[]
          for pos in range(literal_offset,literal_offset+literal_size,8):
              length,index=struct.unpack_from('<II',metadata,pos)
              start=literal_data_offset+index
              literal_records.append(metadata[start:start+length].decode('utf-8',errors='replace'))

          wanted=[int(x,16) for x in '''
          9B7A4F0 9B7A538 9B79C68 9B81818 9B831F8 9B830F0
          9B83D20 9B83D38 9B83D50 9B83D58 9B83D68
          9B83FB8 9B83FC0 9B83FD8 9B83FE0 9B83FE8 9B83FF0 9B83FF8 9B84008
          9B8CAC0 9B8CAC8 9B8CAD0 9B8CAD8 9B8CAE0 9B8CAE8 9B8CAF0 9B8CAF8
          9B93110 9B93118 9C09490
          '''.split()]
          wanted_set=set(wanted)

          def raw_value(elf,stream,address:int)->int:
              for segment in elf.iter_segments():
                  if segment['p_type']!='PT_LOAD': continue
                  start=int(segment['p_vaddr']); filesz=int(segment['p_filesz']); memsz=int(segment['p_memsz'])
                  if start<=address<start+memsz:
                      delta=address-start
                      if delta>=filesz: return 0
                      stream.seek(int(segment['p_offset'])+delta)
                      return struct.unpack('<Q',stream.read(8))[0]
              raise KeyError(f'VA not mapped: 0x{address:X}')

          with binary_path.open('rb') as stream:
              elf=ELFFile(stream)
              relocation_values={}
              relocation_details={}
              for section in elf.iter_sections():
                  if not isinstance(section,RelocationSection): continue
                  symbol_table=elf.get_section(section['sh_link']) if section['sh_link'] else None
                  for relocation in section.iter_relocations():
                      offset=int(relocation['r_offset'])
                      if offset not in wanted_set: continue
                      addend=int(relocation.entry.get('r_addend',0))
                      symbol_value=0; symbol_name=''
                      symbol_index=int(relocation['r_info_sym'])
                      if symbol_table is not None and symbol_index:
                          symbol=symbol_table.get_symbol(symbol_index)
                          symbol_value=int(symbol['st_value']); symbol_name=symbol.name
                      # AArch64 RELATIVE stores the final image-relative value in the addend;
                      # ABS64/GLOB_DAT use symbol value plus addend.
                      relocated=(symbol_value+addend) & 0xffffffffffffffff
                      relocation_values[offset]=relocated
                      relocation_details[offset]={
                          'section':section.name,'type':int(relocation['r_info_type']),
                          'addend':f'0x{addend & 0xffffffffffffffff:016X}',
                          'symbol':symbol_name,'symbolValue':f'0x{symbol_value:X}',
                      }
              results=[]
              for address in wanted:
                  file_value=raw_value(elf,stream,address)
                  encoded=relocation_values.get(address,file_value)
                  encoded32=encoded & 0xffffffff
                  usage_type=(encoded32 & 0xE0000000)>>29
                  index=(encoded32 & 0x1FFFFFFF)>>1
                  value=literal_records[index] if usage_type==5 and index<len(literal_records) else None
                  results.append({
                      'address':f'0x{address:X}','fileValue':f'0x{file_value:016X}',
                      'encoded':f'0x{encoded:016X}','usageType':usage_type,
                      'index':index,'value':value,'relocation':relocation_details.get(address),
                  })
          Path('work/report/string-address-map.json').write_text(json.dumps({'metadataVersion':version,'literalCount':len(literal_records),'results':results},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('work/report/string-address-map.txt').write_text('\n'.join(f"{r['address']}\t{r['encoded']}\ttype={r['usageType']}\tindex={r['index']}\t{r['value']!r}\t{r.get('relocation')}" for r in results)+'\n',encoding='utf-8')
      - name: Remove raw files
        if: ${{ always() }}
        run: rm -rf work/source work/xapk work/unpacked
      - name: Upload address map
        uses: actions/upload-artifact@v4
        with:
          name: tw-il2cpp-string-addresses
          path: work/report
          retention-days: 14
