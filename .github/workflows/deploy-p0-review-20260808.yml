name: Deploy P0 manual-review site

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-deploy-p0-review-20260808.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-p0-review-20260808
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_BRANCH: magius3dviewer
      STAGE_BRANCH: feature/stage-608-current-jp-textures-20260808
      GEM_BRANCH: feature/exact-gem-depthdiff-predicate-20260808
      PREVIEW_BRANCH: preview/p0-20260808
      REVIEW_SUBPATH: review/p0-20260808
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          path: release
      - name: Checkout stage candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.STAGE_BRANCH }}
          fetch-depth: 0
          path: review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            release/package-lock.json
            review/package-lock.json
      - name: Assemble explicit GitHub preview branch
        shell: bash
        working-directory: review
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "${GEM_BRANCH}:refs/remotes/origin/${GEM_BRANCH}"
          git merge --no-edit "origin/${GEM_BRANCH}"
          stage_sha="$(git rev-parse "origin/${STAGE_BRANCH}")"
          gem_sha="$(git rev-parse "origin/${GEM_BRANCH}")"
          preview_sha="$(git rev-parse HEAD)"
          printf '%s\n' \
            "release=${RELEASE_BRANCH}" \
            "stage=${STAGE_BRANCH}@${stage_sha}" \
            "gem=${GEM_BRANCH}@${gem_sha}" \
            "preview=${PREVIEW_BRANCH}@${preview_sha}" \
            > /tmp/p0-review-sources.txt
          git push --force origin "HEAD:${PREVIEW_BRANCH}"
      - name: Install and build unchanged release root
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Install, test and build P0 review candidate
        shell: bash
        working-directory: review
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Assemble one Pages artifact with stable root and isolated review path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p "site/${REVIEW_SUBPATH}" site/review
          cp -a release/dist/. site/
          cp -a review/dist/. "site/${REVIEW_SUBPATH}/"
          cp /tmp/p0-review-sources.txt "site/${REVIEW_SUBPATH}/review-sources.txt"
          release_sha="$(git -C release rev-parse HEAD)"
          preview_sha="$(git -C review rev-parse HEAD)"
          cat > site/review/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magi3Dviewer manual review</title></head>
          <body>
            <main>
              <h1>Magi3Dviewer manual review</h1>
              <p>The repository root is rebuilt from the unchanged release branch. Experimental work is isolated below this page.</p>
              <p><a href="./p0-20260808/">Open P0 2026-08-08 review viewer</a></p>
              <pre>release ${release_sha}\npreview ${preview_sha}</pre>
            </main>
          </body>
          </html>
          EOF
          test -s site/index.html
          test -s "site/${REVIEW_SUBPATH}/index.html"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload combined production + review Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy combined Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public production and review routes
        shell: bash
        run: |
          set -euo pipefail
          root_url="${{ steps.deployment.outputs.page_url }}"
          review_url="${root_url%/}/${REVIEW_SUBPATH}/"
          for attempt in $(seq 1 30); do
            root_code="$(curl -L -sS -o /dev/null -w '%{http_code}' "${root_url}" || true)"
            review_code="$(curl -L -sS -o /dev/null -w '%{http_code}' "${review_url}" || true)"
            if [ "${root_code}" = 200 ] && [ "${review_code}" = 200 ]; then
              printf 'production=%s\nreview=%s\n' "${root_url}" "${review_url}" | tee /tmp/pages-review-url.txt
              exit 0
            fi
            sleep 10
          done
          echo "Pages routes did not both return HTTP 200 after deployment" >&2
          exit 1
