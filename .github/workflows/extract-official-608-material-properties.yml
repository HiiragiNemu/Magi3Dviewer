name: Extract official stage 608 material properties

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-official-608-material-properties.txt'

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_BRANCH: research/stage-608-official-material-properties-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded extractor dependencies
        run: python -m pip install requests msgpack pycryptodome UnityPy lz4
      - name: Extract exact stage 608 Material saved properties
        run: python scripts/extract_official_608_material_properties.py
      - name: Extract current-JP GameObject active and Renderer enabled states
        run: python scripts/extract_official_608_gameobject_states.py
      - name: Extract bounded current-JP AnimationClip visibility/material bindings
        run: python scripts/extract_official_608_animation_bindings.py
      - name: Summarize dynamic/multi-UV material state
        run: python scripts/summarize_official_608_material_properties.py
      - name: Compact sprite/billboard candidate material state
        run: python scripts/compact_official_608_sprite_material_modes.py
      - name: Resolve serialized external file table
        run: python scripts/resolve_official_608_external_files.py
      - name: Upgrade texture comparator with exact orientation classification
        run: python scripts/upgrade_608_texture_comparator_orientation.py
      - name: Resolve all current-JP 608 Material texture dependencies and compare Viewer pixels
        shell: bash
        run: |
          VIEWER_REF="$(git rev-parse origin/magius3dviewer)"
          python scripts/resolve_official_608_material_textures.py --viewer-ref "${VIEWER_REF}"
          test -s research/official-608-material-texture-resolution.json
      - name: Trace target Renderers, Mesh UV diagnostics and TextureSettings
        run: python scripts/extract_official_608_sprite_renderer_mesh_uv.py
      - name: Extract bounded current-JP bg_uber compiled formula windows
        run: python scripts/extract_official_608_bg_uber_formula_windows.py
      - name: Inspect ReflectionProbe Cubemap payloads
        run: python scripts/inspect_official_608_cubemap_payloads.py
      - name: Decode ReflectionProbe Cubemap face chains
        run: python scripts/decode_official_608_cubemap_faces.py
      - name: Extract ReflectionProbe spatial profiles
        run: python scripts/extract_official_608_reflection_probe_profile.py
      - name: Extract ParticleSystem and renderer components
        run: python scripts/extract_official_608_particles.py
      - name: Summarize executable particle profiles
        run: python scripts/summarize_official_608_particles.py
      - name: Resolve particle renderer Material and stage-local dependency evidence
        run: python scripts/resolve_official_608_particle_material.py
      - name: Diagnose current JP AssetBundle dependency route
        run: python scripts/diagnose_current_jp_assetbundle_manifest.py
      - name: Resolve exact particle BaseMap from current JP catalog dependencies
        run: python scripts/resolve_official_608_particle_texture.py
      - name: Summarize exact six-system runtime profile
        run: python scripts/summarize_official_608_particle_runtime.py
      - name: Extract exact enabled size/rotation/UV modules
        run: python scripts/extract_official_608_particle_enabled_modules.py
      - name: Derive exact stage-root particle transforms
        run: python scripts/derive_official_608_particle_stage_root_profiles.py
      - name: Inspect release stage runtime extension hooks
        run: python scripts/inspect_release_stage_runtime_hooks.py
      - name: Diff current JP Materials against release materialBindings
        shell: bash
        run: |
          VIEWER_REF="$(git rev-parse origin/magius3dviewer)"
          git show "${VIEWER_REF}:public/stages/catalog/battle-608-00-00-001.json" > /tmp/release-608.json
          python scripts/diff_official_608_material_bindings.py \
            --viewer-catalog /tmp/release-608.json \
            --viewer-ref "${VIEWER_REF}"
      - name: Persist bounded stage evidence only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -s research/official-608-material-texture-resolution.json
          test -s research/official-608-bg-uber-formula-windows.json
          test -s research/official-608-animation-bindings.json
          git add \
            scripts/resolve_official_608_material_textures.py \
            research/official-608-material-properties.json \
            research/official-608-gameobject-states.json \
            research/official-608-animation-bindings.json \
            research/official-608-material-summary.json \
            research/official-608-sprite-material-modes.json \
            research/official-608-external-files.json \
            research/official-608-material-texture-resolution.json \
            research/official-608-sprite-renderer-mesh-uv.json \
            research/official-608-bg-uber-formula-windows.json \
            research/official-608-cubemap-payloads.json \
            research/official-608-cubemap-face-decode.json \
            research/official-608-reflection-probes.json \
            research/official-608-particle-systems.json \
            research/official-608-particle-summary.json \
            research/official-608-particle-material.json \
            research/official-jp-assetbundle-manifest-discovery.json \
            research/official-608-particle-texture.json \
            research/official-608-blue-bubble.png \
            research/official-608-particle-runtime-profile.json \
            research/official-608-particle-enabled-modules.json \
            research/official-608-particle-stage-root-profiles.json \
            research/release-stage-runtime-hooks.json \
            research/official-608-vs-release-material-bindings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: persist bounded current-JP 608 animation bindings'
          git push origin HEAD:${TARGET_BRANCH}
