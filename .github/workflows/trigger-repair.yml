name: Trigger guarded Magius3Dviewer repair

on:
  pull_request:
    types: [opened, synchronize]
    branches: ['main']

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  guarded-repair-control:
    if: github.event.pull_request.title == '[automation] Repair Magius3Dviewer portrait release'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the one-time repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run repair-magius-release.yml \
            --repo "${{ github.repository }}" \
            --ref main

      - name: Report latest repair workflow runs
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow repair-magius-release.yml \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,createdAt,url,name
