name: Validate stage 608 ChairCD feature

on:
  push:
    branches:
      - fix/stage-608-chair-alpha-cutout-20260807
    paths:
      - automation/trigger-stage-608-chair-alpha-validation.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stage-608-chair-alpha-cutout-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Audit production dependency tree
        run: npm audit --audit-level=high
      - name: Run release tests and production build
        run: npm run build
      - name: Install Playwright Chromium for fixed visual regression
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite and wait for HTTPS endpoint
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/magius-vite.log 2>&1 &
          echo $! >/tmp/magius-vite.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --insecure https://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/magius-vite.log
          exit 1
      - name: Fixed visual regression — 100107 plus battle-608-00-00-001
        env:
          MAGIUS_TEST_URL: https://127.0.0.1:4173/
          MAGIUS_VISUAL_OUTPUT: visual-regression-output
        run: node scripts/visual-regression-100107-stage608.mjs
      - name: Show Vite log
        if: always()
        run: cat /tmp/magius-vite.log || true
      - name: Upload fixed regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-608-chair-alpha-100107-regression
          path: visual-regression-output/
          if-no-files-found: error
