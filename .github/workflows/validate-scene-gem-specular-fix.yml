name: Validate scene exposure and Gem material fix

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-scene-gem-specular-fix.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: fix/scene-gem-specular-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Apply scene and material patch
        run: python scripts/apply_scene_gem_specular_fix.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run complete production build
        run: npm run build
      - name: Persist validated source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            public/stages/catalog.json \
            magia-exedra-character-three/loader.ts \
            magia-exedra-character-three/shaders/gem.ts \
            magia-exedra-character-three/shaders/gemExtension.ts \
            magia-exedra-character-three/shaders/general.ts \
            magia-exedra-character-three/shaders/stylization.ts \
            package.json \
            sceneGemSpecularFix.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: neutralize legacy scene lighting and restore per-character Gem MatCap'
          git push origin HEAD:${TARGET_BRANCH}
