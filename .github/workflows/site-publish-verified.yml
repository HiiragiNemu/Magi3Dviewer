name: Publish verified website to Cloudflare
on:
  push:
    branches: [magius3dviewer]
    paths: ['.github/workflows/site-publish-verified.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: current-website-delivery
  cancel-in-progress: true
# Freshly compile the current Cloudflare package. Reuse the expensive pointer
# verification only while the application, rendering and resource source is
# unchanged from its successful run; otherwise use site-delivery.yml.
# Consumed-profile diagnostics are covered by siteStageDelivery.test.mjs.
env:
  POSE_SOURCE: 31a4b3ed0949f31e265919ba125d553d6225506b
  POSE_RUN: '36542133898'
jobs:
  configuration:
    runs-on: ubuntu-latest
    environment: magius3dviewer-live
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.project.outputs.branch }}
    steps:
      - name: Verify authorization for the existing Cloudflare production project
        id: project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report={tokenPresent:!!process.env.CF_TOKEN,accountPresent:!!process.env.CF_ACCOUNT,configured:false};
          try{
            assert.ok(report.tokenPresent&&report.accountPresent,'CLOUDFLARE_AUTHORIZATION_MISSING: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; no GitHub Pages fallback will be used');
            assert.match(process.env.CF_ACCOUNT,/^[a-f0-9]{32}$/i,'Invalid Cloudflare account identifier');
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT}/pages/projects/magius3dviewer`,{headers:{Authorization:`Bearer ${process.env.CF_TOKEN}`},redirect:'error',signal:AbortSignal.timeout(30000)});
            report.httpStatus=r.status;assert.equal(r.status,200,'Existing Cloudflare project access rejected');
            const data=await r.json();assert.ok(data.success&&data.result?.name==='magius3dviewer');
            assert.match(data.result.production_branch,/^[A-Za-z0-9_./-]+$/);
            report.configured=true;report.productionBranch=data.result.production_branch;
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`branch=${report.productionBranch}\n`);
          }finally{
            fs.mkdirSync('/tmp/cf-access',{recursive:true});fs.writeFileSync('/tmp/cf-access/access.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Cloudflare authorization: ${report.configured?'verified':'NOT AVAILABLE; no website was replaced'}.\n`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-access
          path: /tmp/cf-access/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p /tmp/site-evidence
      - name: Prove application and resources still match the successful real-pointer test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const api='https://api.github.com/repos/HiiragiNemu/Magi3Dviewer';
          async function get(route){const r=await fetch(api+route,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(60000)});assert.equal(r.status,200,'GitHub provenance read failed');return r.json();}
          const run=await get('/actions/runs/'+process.env.POSE_RUN);assert.equal(run.head_sha,process.env.POSE_SOURCE);assert.equal(run.head_branch,'magius3dviewer');assert.equal(run.path,'.github/workflows/site-delivery.yml');
          const jobs=await get('/actions/runs/'+process.env.POSE_RUN+'/jobs?per_page=100');assert.ok(jobs.total_count<100);
          const build=jobs.jobs.find(j=>j.name==='build');assert.equal(build?.conclusion,'success');
          assert.equal(build.steps.find(s=>s.name==='Verify real pointer interaction, skinning and multi-character rendering')?.conclusion,'success');
          const allowed=new Set(['.github/workflows/site-delivery.yml','.github/workflows/site-publish-verified.yml','scripts/site-smoke-stage-delivery.mjs','siteStageDelivery.test.mjs','scripts/site-smoke-cloudflare.mjs','scripts/test-website.mjs','scripts/build-deployment.mjs','package.json','docs/reports/2026-09-29-pose-delivery-resume.md','docs/reports/2026-09-29-cloudflare-delivery.md']);
          const head=(await get('/branches/magius3dviewer')).commit.sha;
          const comparisons=[];
          for(const ref of new Set([process.env.GITHUB_SHA,head])){
            const c=await get('/compare/'+process.env.POSE_SOURCE+'...'+ref);assert.ok(['ahead','identical'].includes(c.status));assert.equal(c.merge_base_commit.sha,process.env.POSE_SOURCE);assert.ok(c.total_commits<100&&c.files.length<300);
            assert.ok(c.files.every(f=>allowed.has(f.filename)),'Application or resources changed: run the full fresh pointer verification in site-delivery.yml');
            const old=await get('/contents/package.json?ref='+process.env.POSE_SOURCE),current=await get('/contents/package.json?ref='+ref);
            const a=JSON.parse(Buffer.from(old.content,'base64')),b=JSON.parse(Buffer.from(current.content,'base64'));
            delete a.scripts;delete b.scripts;assert.deepEqual(b,a,'Dependency or application metadata changed');
            comparisons.push({head:ref,changed:c.files.map(f=>f.filename)});
          }
          fs.writeFileSync('/tmp/site-evidence/pose-verification-provenance.json',JSON.stringify({applicationRevision:process.env.GITHUB_SHA,poseSource:process.env.POSE_SOURCE,poseRun:run.id,buildJob:build.id,comparisons},null,2)+'\n');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: site-delivery-evidence
          path: /tmp/site-evidence/original-pose
          run-id: 36542133898
          github-token: ${{ github.token }}
      - run: npm ci
      - name: Run the complete Cloudflare build entrypoint with current regressions and typecheck
        run: |
          set -euo pipefail
          npm run build:deploy 2>&1 | tee /tmp/site-evidence/cloudflare-build.log
      - name: Verify full stage closures and Cloudflare file limits
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const root='dist-deploy',version=JSON.parse(fs.readFileSync(root+'/site-version.json','utf8'));
          assert.equal(version.revision,process.env.GITHUB_SHA);assert.equal(version.deploymentTarget,'cloudflare');
          const catalog=JSON.parse(fs.readFileSync(root+'/catalogs/runtime-product-delivery.v1.json','utf8'));
          assert.equal(catalog.bundledStageBaseUrl,undefined,'Public GitHub raw stage fallback is not permitted');
          assert.equal(catalog.deliveryGateway.replace(/\/$/,''),'https://magius3dviewer-runtime-products.crynetsystemscell.workers.dev');
          for(const stage of catalog.bundledStageRoots){assert.match(stage,/^\/stages\/official\/[A-Za-z0-9_-]+\/$/);assert.ok(fs.statSync(path.join(root,stage.slice(1))).isDirectory());}
          const files=[];function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const file=path.join(dir,e.name);if(e.isDirectory())walk(file);else{assert.ok(e.isFile());const bytes=fs.statSync(file).size;assert.ok(bytes<=25*1024**2,'Cloudflare file too large: '+file);files.push({path:path.relative(root,file),bytes});}}}walk(root);
          assert.ok(files.length<=20000);assert.equal(files.filter(f=>f.path.startsWith('stages/official/')).length,1549);
          const pose=JSON.parse(fs.readFileSync('/tmp/site-evidence/original-pose/pose-browser.json','utf8'));assert.equal(pose.passed,true);
          fs.writeFileSync('/tmp/site-evidence/cloudflare-full-payload.json',JSON.stringify({revision:version.revision,files:files.length,bytes:files.reduce((s,f)=>s+f.bytes,0),stageDirectories:catalog.bundledStageRoots.length,stageFiles:1549,publicSourceFallback:false},null,2)+'\n');
          NODE
      - name: Install isolated browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@25.12.0
      - name: Render the fresh full candidate with source-repository network requests blocked
        run: node scripts/site-smoke-cloudflare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-build-evidence
          path: /tmp/site-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: verified-cloudflare-website
          path: dist-deploy/
          compression-level: 1
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-delivery-tools
          path: scripts/site-smoke-cloudflare.mjs
          retention-days: 3
  publish:
    needs: [configuration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: magius3dviewer-live
      url: https://magius3dviewer.pages.dev/
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: verified-cloudflare-website
          path: dist-deploy
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-delivery-tools
          path: scripts
      - name: Verify private-release gateway before replacing the production site
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const gateway='https://magius3dviewer-runtime-products.crynetsystemscell.workers.dev';
          const r=await fetch(gateway+'/healthz?check='+Date.now(),{signal:AbortSignal.timeout(60000)});assert.equal(r.status,200);
          const h=await r.json();assert.equal(h.status,'ready');assert.equal(h.repository,'HiiragiNemu/Magi3Dviewer');
          assert.equal(h.probe.releaseTag,'runtime-products-v1-a');assert.match(h.probe.assetName,/^[A-Za-z0-9._-]+\.zip$/);
          const p=await fetch(gateway+'/'+h.probe.releaseTag+'/'+h.probe.assetName,{headers:{Range:'bytes=0-0'},signal:AbortSignal.timeout(60000)});
          assert.equal(p.status,206);assert.equal(p.headers.get('content-range'),`bytes 0-0/${h.probe.assetBytes}`);assert.equal(p.headers.get('access-control-allow-origin'),'*');await p.body?.cancel();
          NODE
      - name: Overwrite the existing Cloudflare production website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          command: pages deploy dist-deploy --project-name=magius3dviewer --branch=${{ needs.configuration.outputs.branch }} --commit-hash=${{ github.sha }}
      - name: Verify actual public source revision, HTML, catalog and every JavaScript file
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const site='https://magius3dviewer.pages.dev/',hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          let ready=false;
          for(let i=0;i<18;i++){try{const r=await fetch(site+'site-version.json?check='+Date.now(),{signal:AbortSignal.timeout(30000)});if(r.ok&&(await r.json()).revision===process.env.GITHUB_SHA){ready=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,5000));}
          assert.ok(ready,'Cloudflare production has not reached the tested revision');
          const files=['index.html','catalogs/runtime-product-delivery.v1.json',...fs.readdirSync('dist-deploy/assets').filter(f=>f.endsWith('.js')).map(f=>'assets/'+f)],verified=[];
          for(const file of files){const r=await fetch(new URL(file,site),{cache:'no-store',signal:AbortSignal.timeout(60000)});assert.equal(r.status,200,file);const bytes=Buffer.from(await r.arrayBuffer());assert.equal(hash(bytes),hash(fs.readFileSync('dist-deploy/'+file)),file);verified.push({path:file,bytes:bytes.length,sha256:hash(bytes)});}
          fs.mkdirSync('/tmp/site-evidence',{recursive:true});fs.writeFileSync('/tmp/site-evidence/cloudflare-public-release.json',JSON.stringify({passed:true,site,revision:process.env.GITHUB_SHA,verifiedAt:new Date().toISOString(),verified},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Published and byte-verified Cloudflare production: ${site}\nSource: ${process.env.GITHUB_SHA}\n`);
          NODE
      - name: Verify actual production browser without direct source-repository access
        env:
          MAGIUS_SITE_URL: https://magius3dviewer.pages.dev/
        run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --ignore-scripts puppeteer-core@25.12.0
          node scripts/site-smoke-cloudflare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-publication-evidence
          path: /tmp/site-evidence/
          retention-days: 14
