name: Research Ashley 110701 animation binding
run-name: Diagnose Ashley 110701 FBX skeleton and animation channels

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/research-ashley-binding.yml']
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths: ['.github/research-triggers/ashley-binding.txt']

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: ashley-110701-binding-research
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Magius3Dviewer source
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer

      - name: Install FBX inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils

      - name: Decompress Ashley and control FBX files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/fbx work/out
          find magia-exedra-character-three/models/chara_110701_battle_unit -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | tee work/out/ashley-directory.txt
          for id in 110701 100107; do
            src=$(find "magia-exedra-character-three/models/chara_${id}_battle_unit" -type f -name '*.fbx.gz' -print -quit)
            test -n "$src"
            gzip -dc "$src" > "work/fbx/chara_${id}.fbx"
            sha256sum "$src" "work/fbx/chara_${id}.fbx" >> work/out/checksums.txt
            assimp info "work/fbx/chara_${id}.fbx" > "work/out/chara_${id}-assimp-info.txt" 2>&1 || true
            assimp export "work/fbx/chara_${id}.fbx" "work/out/chara_${id}.assjson" -f assjson > "work/out/chara_${id}-assimp-export.log" 2>&1 || true
          done

      - name: Analyze skeleton and animation-channel bindings
        shell: python
        run: |
          from pathlib import Path
          import json, re
          from collections import Counter, defaultdict

          def norm(value):
            return re.sub(r'[^a-z0-9]', '', str(value).split(':')[-1].lower())

          def load(character_id):
            path = Path(f'work/out/chara_{character_id}.assjson')
            if not path.exists():
              return {'error': 'assjson export missing'}
            data = json.loads(path.read_text(encoding='utf-8', errors='ignore'))
            nodes=[]; paths=[]
            def walk(node, prefix=''):
              name=str(node.get('name',''))
              current=f'{prefix}/{name}'.strip('/')
              nodes.append(name); paths.append(current)
              for child in node.get('children',[]) or []: walk(child,current)
            walk(data.get('rootnode',{}))
            bones=[]
            for mesh_index,mesh in enumerate(data.get('meshes',[]) or []):
              for bone in mesh.get('bones',[]) or []:
                bones.append({'mesh':mesh_index,'name':bone.get('name',''),'weights':len(bone.get('weights',[]) or [])})
            animations=[]; channels=[]
            for animation in data.get('animations',[]) or []:
              name=animation.get('name',''); clip_channels=[]
              for channel in animation.get('channels',[]) or []:
                node=channel.get('name',channel.get('nodename',''))
                clip_channels.append(node)
                channels.append({'animation':name,'node':node,'positionKeys':len(channel.get('positionkeys',[]) or []),'rotationKeys':len(channel.get('rotationkeys',[]) or []),'scalingKeys':len(channel.get('scalingkeys',[]) or [])})
              animations.append({'name':name,'duration':animation.get('duration'),'ticksPerSecond':animation.get('tickspersecond'),'channels':clip_channels})
            node_set=set(nodes); normalized=defaultdict(list)
            for node in nodes: normalized[norm(node)].append(node)
            bindings=[]
            for item in channels:
              node=item['node']
              if node in node_set: status='exact'; candidates=[node]
              elif norm(node) in normalized: status='normalized'; candidates=normalized[norm(node)]
              else: status='missing'; candidates=[]
              bindings.append({**item,'status':status,'candidates':candidates})
            return {'nodeCount':len(nodes),'nodeNames':nodes,'nodePaths':paths,'meshBoneCount':len(bones),'meshBones':bones,'animationCount':len(animations),'animations':animations,'bindingStatus':dict(Counter(x['status'] for x in bindings)),'bindings':bindings,'duplicateNormalizedNodes':{k:v for k,v in normalized.items() if len(v)>1}}

          ashley=load(110701); control=load(100107)
          result={'schemaVersion':1,'ashley':ashley,'controlMadoka':control}
          if 'nodeNames' in ashley and 'nodeNames' in control:
            a=set(map(norm,ashley['nodeNames'])); c=set(map(norm,control['nodeNames']))
            result['skeletonComparison']={'sharedNormalizedNodes':len(a&c),'ashleyOnly':sorted(a-c),'controlOnly':sorted(c-a)}
          source=Path('magia-exedra-character-three/character.ts').read_text(encoding='utf-8')
          result['viewerCode']={'exactAnimationFamilies':'getAnimationFamilyName' in source,'deduplicatesCompanionChannels':'duplicate animation bindings' in source.lower(),'legacyStartsWithSelection':'.filter(x => x.name.startsWith(name))' in source}
          Path('work/out/ashley-binding-diagnostics.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          summary=['# Ashley 110701 binding diagnostics','']
          if 'error' in ashley:
            summary.append(f"- Error: {ashley['error']}")
          else:
            summary += [f"- Nodes: **{ashley['nodeCount']}**",f"- Skin bones: **{ashley['meshBoneCount']}**",f"- Animation clips: **{ashley['animationCount']}**",f"- Binding status: `{ashley['bindingStatus']}`",'', '## Missing channels','']
            missing=[x for x in ashley['bindings'] if x['status']=='missing']
            summary += [f"- `{x['animation']}` -> `{x['node']}`" for x in missing] or ['No Assimp-level missing channels detected.']
          Path('work/out/ASHLEY_BINDING_DIAGNOSTICS.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')

      - name: Package diagnostics
        run: tar -czf ashley-110701-binding-diagnostics.tar.gz work/out

      - name: Upload private diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashley-110701-binding-diagnostics
          path: ashley-110701-binding-diagnostics.tar.gz
          retention-days: 14

      - name: Publish diagnostic status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const status='${{ job.status }}';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:status==='success'?'success':'failure',context:'Ashley 110701 FBX binding diagnostics',description:status==='success'?'Ashley binding artifact generated':'Ashley binding diagnostics failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
