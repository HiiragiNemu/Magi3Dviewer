name: Apply stage 608 ChairCD alpha cutout patch

on:
  push:
    branches:
      - fix/stage-608-chair-alpha-cutout-20260807
    paths:
      - automation/trigger-stage-608-chair-alpha-cutout.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stage-608-chair-alpha-cutout-20260807
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact current-JP ChairCD alpha state
        run: python scripts/apply_stage_608_chair_alpha_cutout_patch.py
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/stages/catalog/battle-608-00-00-001.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore current-JP 608 ChairCD alpha cutout'
          git push origin HEAD:fix/stage-608-chair-alpha-cutout-20260807
