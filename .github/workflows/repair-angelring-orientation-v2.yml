name: Repair AngelRing orientation v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/ANGELRING_PERSPECTIVE_V3_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-angelring-orientation-v2
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation source
        uses: actions/checkout@v5
        with:
          ref: main
          path: automation

      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer
          path: release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply perspective-correct AngelRing patch
        run: python automation/.github/scripts/patch_angelring_perspective.py release

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Install, audit and build
        working-directory: release
        run: |
          npm ci
          npm audit --audit-level=low
          npm run build
          git diff --check

      - name: Commit release repair
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add magia-exedra-character-three/shaders/hair.ts \
                  angelRingHeadLock.test.mjs \
                  scripts/smoke-runtime-v2.mjs \
                  scripts/smoke-angelring-two-character.mjs
          if git diff --cached --quiet; then
            echo 'No source changes were required.'
          else
            git commit -m 'fix: project AngelRing Head Up through camera matrix'
            git push origin HEAD:magius3dviewer
          fi

      - name: Request protected deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-magius3dviewer"}'
