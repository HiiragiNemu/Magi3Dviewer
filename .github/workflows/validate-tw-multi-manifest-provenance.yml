name: Validate TW multi-manifest provenance

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-tw-multi-manifest-provenance.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: feature/tw-multi-manifest-provenance-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - run: python scripts/apply_tw_multi_manifest_provenance_patch.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Persist validated provenance changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/viewer/stageBundleProvenance.ts package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: retain multiple TW AssetBundle manifest sources'
          git push origin HEAD:${TARGET_BRANCH}
