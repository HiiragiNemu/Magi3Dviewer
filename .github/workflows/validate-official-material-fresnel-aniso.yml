name: Validate official material Fresnel and Aniso

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-official-material-fresnel-aniso.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: feature/official-material-fresnel-aniso-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Apply exact current-JP material profiles
        run: python scripts/apply_official_material_fresnel_aniso.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run complete production build
        run: npm run build
      - name: Persist validated source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            magia-exedra-character-three/materialProfile.ts \
            magia-exedra-character-three/shaders/gem.ts \
            magia-exedra-character-three/shaders/general.ts \
            magia-exedra-character-three/shaders/stylization.ts \
            package.json \
            officialMaterialFresnelAniso.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: apply exact per-material Fresnel and Aniso defaults'
          git push origin HEAD:${TARGET_BRANCH}
