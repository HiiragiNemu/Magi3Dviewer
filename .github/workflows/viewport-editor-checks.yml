name: Verify viewport editing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAGIUS_EVIDENCE_DIR: /tmp/viewport-evidence
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build current source with joint, floor and UI regressions
        run: npm run build:deploy
      - name: Install isolated browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@25.12.0
      - name: Verify actual viewport gestures, camera, floor and compact layout
        run: node scripts/site-smoke-viewport.mjs
      - name: Verify portrait and landscape multi-touch TPS and grounded jump recovery
        run: node scripts/site-smoke-mobile-tps.mjs
      - name: Verify deployment-only jump style and unchanged original motion tracks
        run: node scripts/site-smoke-jump-style.mjs
      - name: Verify entry identity, no rollback UI and continuous moving contact
        run: node scripts/site-smoke-entry-landing.mjs
      - name: Verify current scene resources without public source-repository access
        run: node scripts/site-smoke-cloudflare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-editor-evidence
          path: /tmp/viewport-evidence/
          retention-days: 7
