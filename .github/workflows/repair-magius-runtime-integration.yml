name: Repair Magius runtime integration
run-name: Structurally fix capability-gated Hair and ReDriveVolume stage runtime

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['.github/workflows/repair-magius-runtime-integration.yml']

permissions:
  contents: write
  statuses: write

concurrency:
  group: repair-magius-runtime-integration
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Magius3Dviewer source
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer
          fetch-depth: 0

      - name: Gate Hair material construction by character capability
        shell: python
        run: |
          from pathlib import Path

          path=Path('magia-exedra-character-three/loader.ts')
          text=path.read_text(encoding='utf-8')
          marker="                            if (name.includes('hair')) {"
          if 'AngelRing capability/reference' not in text:
            start=text.index(marker)
            outer_else=text.index(
              "                            } else {\n                                const result = await createGeneralMaterial",
              start,
            )
            replacement='''                            if (name.includes('hair')) {
                                  const angelRingReference = createAngelRingReference(modelObject, mesh, characterProfile)
                                  if (angelRingReference) {
                                      const result = await createHairMaterial({
                                          ...sharedMaterialOptions,
                                          alphaSrc,
                                          angelRingReference,
                                      })
                                      material = result.material
                                      textures = result.textures
                                      alphaTex = result.alphaTex
                                      if (result.updateAngelRingReference) {
                                          userData.animationLoops.push(result.updateAngelRingReference)
                                      }
                                  } else {
                                      const result = await createGeneralMaterial({
                                          ...sharedMaterialOptions,
                                          alphaSrc,
                                      })
                                      material = result.material
                                      textures = result.textures
                                      alphaTex = result.alphaTex
                                  }
                                  console.log('AngelRing capability/reference:', {
                                      enabled: characterProfile.angelRingEnabled,
                                      reference: angelRingReference,
                                  })
          '''
            text=text[:start]+replacement+text[outer_else:]
          path.write_text(text,encoding='utf-8')

      - name: Place ReDriveVolume runtime call inside stage profile function
        shell: python
        run: |
          from pathlib import Path
          import re

          path=Path('src/viewer/stages.ts')
          text=path.read_text(encoding='utf-8')
          start=text.index('async function applyStageRenderProfile')
          restore=text.index('function restoreSceneProfile',start)
          section=text[start:restore]
          section=re.sub(
            r'\n}\n\s*applyReDriveVolumeRuntime\(\s*profile\.reDriveVolume as ReDriveVolumeRuntimeProfile \| undefined,\s*\)\s*$',
            '\n    applyReDriveVolumeRuntime(\n        profile.reDriveVolume as ReDriveVolumeRuntimeProfile | undefined,\n    )\n}\n\n',
            section,
            flags=re.S,
          )
          if 'applyReDriveVolumeRuntime(' not in section:
            close=section.rfind('\n}')
            if close<0: raise SystemExit('applyStageRenderProfile closing brace not found')
            section=(section[:close]
              +'\n    applyReDriveVolumeRuntime(\n'
              +'        profile.reDriveVolume as ReDriveVolumeRuntimeProfile | undefined,\n'
              +'    )'
              +section[close:])
          if section.count('applyReDriveVolumeRuntime(')!=1:
            raise SystemExit(f'Unexpected runtime call count {section.count("applyReDriveVolumeRuntime(")}')
          text=text[:start]+section+text[restore:]
          path.write_text(text,encoding='utf-8')

      - name: Validate repaired source shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F "AngelRing capability/reference" magia-exedra-character-three/loader.ts
          python - <<'PY'
          from pathlib import Path
          text=Path('src/viewer/stages.ts').read_text(encoding='utf-8')
          section=text[text.index('async function applyStageRenderProfile'):text.index('function restoreSceneProfile')]
          assert section.count('applyReDriveVolumeRuntime(')==1, section
          assert section.rstrip().endswith('}'), section[-1000:]
          PY

      - name: Commit and push repaired integration
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add magia-exedra-character-three/loader.ts src/viewer/stages.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(runtime): gate Hair feature and scope stage volume call'
            git push origin HEAD:magius3dviewer
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish repair status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const status='${{ job.status }}';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:process.env.SOURCE_SHA||context.sha,state:status==='success'?'success':'failure',context:'Magius runtime integration repair',description:status==='success'?'Hair gating and stage volume scoping repaired':'Runtime integration repair failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
