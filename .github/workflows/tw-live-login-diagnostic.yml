name: Diagnose Taiwan live guest login
run-name: Test empty-JWT game login and protected config access

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/tw-live-login-diagnostic.yml'
      - 'analysis-requests/tw-live-login-diagnostic.txt'

permissions:
  contents: read

concurrency:
  group: tw-live-login-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install protocol dependencies
        run: python -m pip install --disable-pip-version-check requests msgpack pycryptodome
      - name: Run sanitized login diagnostic
        shell: python
        run: |
          from __future__ import annotations
          import base64, hashlib, json, os, time, uuid
          from pathlib import Path
          from typing import Any
          import msgpack, requests
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad, unpad

          HOST='https://app-mme.so-net.tw'
          KEY=b'/TZh+1VxrtkNiDEH'
          APP='1.0.5'; UNITY='2022.3.62f3'
          client_uuid=uuid.uuid4().hex
          http=requests.Session()
          report:dict[str,Any]={'schemaVersion':1,'host':HOST,'appVersion':APP,'unityVersion':UNITY}

          def filetime_now()->int:
              return int((time.time()+11644473600)*10_000_000)

          def encode(payload:dict[str,Any], user_id:int=0, session_id:str='', ctag:str|None=None):
              envelope={
                  'payload':payload,
                  'uuid':client_uuid,
                  'userId':user_id,
                  'sessionId':session_id,
                  'actionToken':None,
                  'ctag':ctag,
                  'actionTime':filetime_now(),
              }
              plain=msgpack.packb(envelope,use_bin_type=True)
              iv=os.urandom(16)
              body=iv+AES.new(KEY,AES.MODE_CBC,iv).encrypt(pad(plain,16))
              signature=base64.b64encode(hashlib.sha1(body).digest()).decode()
              return body,signature

          def headers(signature:str)->dict[str,str]:
              return {
                  'Accept':'*/*',
                  'Content-Type':'application/x-msgpack',
                  'x-region':'TW',
                  'x-language':'zh_TW',
                  'x-timezone-offset':'28800',
                  'x-app-version':APP,
                  'X-GAME-SERVER-URL':HOST,
                  'X-post-signature':signature,
                  'X-Unity-Version':UNITY,
              }

          def decode(content:bytes)->dict[str,Any]:
              if len(content)<32 or len(content)%16: return {'_rawSize':len(content),'_rawSha256':hashlib.sha256(content).hexdigest()}
              try:
                  plain=unpad(AES.new(KEY,AES.MODE_CBC,content[:16]).decrypt(content[16:]),16)
                  value=msgpack.unpackb(plain,raw=False,strict_map_key=False)
                  return value if isinstance(value,dict) else {'_type':type(value).__name__}
              except Exception as exc:
                  return {'_decodeError':type(exc).__name__,'_rawSize':len(content),'_rawSha256':hashlib.sha256(content).hexdigest()}

          def sanitize(value:Any,key:str='')->Any:
              secret=re.compile(r'(?i)(session|token|jwt|uuid|user.?id|ctag|handover|guid)')
              if isinstance(value,dict):
                  return {str(k):sanitize(v,str(k)) for k,v in value.items()}
              if isinstance(value,list): return [sanitize(v,key) for v in value[:100]]
              if secret.search(key) and value not in (None,'',0,False):
                  raw=str(value).encode(); return {'present':True,'sha256':hashlib.sha256(raw).hexdigest(),'length':len(raw)}
              if isinstance(value,(str,int,float,bool)) or value is None: return value
              return repr(value)[:200]

          import re
          login_payload={
              'appVersion':APP,'urlParam':'','deviceModel':'GitHubActions Android',
              'osType':2,'osVersion':'Android 14','storeType':2,
              'graphicsDeviceId':0,'graphicsDeviceVendorId':0,'processorCount':8,
              'processorType':'arm64-v8a','supportedRenderTargetCount':4,
              'supports3DTextures':True,'supportsAccelerometer':True,
              'supportsComputeShaders':True,'supportsGyroscope':True,
              'supportsImageEffects':True,'supportsInstancing':True,
              'supportsLocationService':True,'supportsRenderTextures':True,
              'supportsRenderToCubemap':True,'supportsShadows':True,
              'supportsSparseTextures':False,'supportsStencil':1,'supportsVibration':True,
              'uuid':client_uuid,'xuid':0,'jwttoken':'','sm':'',
          }
          body,sig=encode(login_payload)
          response=http.post(HOST+'/api/login',headers=headers(sig),data=body,timeout=30)
          decoded=decode(response.content)
          report['login']={
              'httpStatus':response.status_code,
              'headers':{k.lower():v for k,v in response.headers.items() if k.lower().startswith('x-')},
              'response':sanitize(decoded),
          }

          payload=decoded.get('payload') if isinstance(decoded,dict) else None
          user_id=payload.get('userId') if isinstance(payload,dict) else None
          session_id=payload.get('sessionId') if isinstance(payload,dict) else None
          ctag=decoded.get('ctag') if isinstance(decoded,dict) else None
          if isinstance(user_id,int) and user_id>0 and isinstance(session_id,str) and session_id:
              report['login']['accepted']=True
              common={'sm':'','lastHomeAccessTime':''}
              for label,path in (
                  ('gameConfig','/api/config/get_config'),
                  ('akamaiToken','/api/akamai/create_token'),
              ):
                  b,s=encode(common,user_id,session_id,ctag if isinstance(ctag,str) else None)
                  r=http.post(HOST+path,headers=headers(s),data=b,timeout=30)
                  d=decode(r.content)
                  report[label]={
                      'httpStatus':r.status_code,
                      'headers':{k.lower():v for k,v in r.headers.items() if k.lower().startswith('x-')},
                      'response':sanitize(d),
                  }
          else:
              report['login']['accepted']=False

          Path('work/report').mkdir(parents=True,exist_ok=True)
          Path('work/report/live-login-diagnostic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: tw-live-login-diagnostic
          path: work/report
          retention-days: 14
          if-no-files-found: error
