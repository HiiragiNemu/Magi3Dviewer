name: Validate ReDriveVolume background runtime

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-redrive-volume-runtime.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feature/redrive-volume-runtime-20260807
    steps:
      - name: Checkout rendering branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply background-only ReDriveVolume runtime
        run: python scripts/apply_redrive_volume_runtime_patch.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release tests and production build
        run: npm run build

      - name: Persist validated rendering changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            magia-exedra-character-three/scene/effects.ts \
            magia-exedra-character-three/scene/index.ts \
            src/viewer/reDriveVolumeRuntime.ts \
            src/viewer/stages.ts \
            package.json
          if git diff --cached --quiet; then
            echo 'ReDriveVolume runtime changes already current.'
            exit 0
          fi
          git commit -m 'feat: apply official background-only ReDriveVolume grading'
          git push origin HEAD:${TARGET_BRANCH}
