name: Validate stage 608 exact render states

on:
  push:
    branches:
      - fix/stage-608-exact-render-state-20260808
    paths:
      - automation/trigger-stage-608-exact-render-state-20260808.txt
  pull_request:
    branches:
      - preview/p0-20260808
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stage-608-exact-render-state-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply fail-closed render-state patch
        run: python3 scripts/apply_stage_608_exact_render_state_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Gate current-JP 608 flipbook and render states
        run: |
          node stage608Flipbook.test.mjs
          node stage608RenderState.test.mjs
      - name: Gate existing stage material binder
        run: node stageMaterialBindings.test.mjs
      - name: Production build
        run: npm run build
      - name: Persist validated runtime changes
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/viewer/stageMaterialBindings.ts public/stages/catalog/battle-608-00-00-001.json
          if git diff --cached --quiet; then
            echo 'No runtime changes to persist.'
            exit 0
          fi
          git commit -m 'fix: restore current-JP 608 depth and blend states'
          git push origin HEAD:fix/stage-608-exact-render-state-20260808
