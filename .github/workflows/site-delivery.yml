name: Deploy tested website to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/site-publish-verified.yml'
      - 'docs/reports/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-website-delivery
  cancel-in-progress: true
jobs:
  configuration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: magius3dviewer-live
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.project.outputs.branch }}
    steps:
      - name: Verify access to the existing Cloudflare production project
        id: project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          assert.ok(process.env.CF_TOKEN && process.env.CF_ACCOUNT,'Cloudflare deployment credentials are missing. This workflow will not publish to GitHub Pages or use public GitHub raw resources.');
          assert.match(process.env.CF_ACCOUNT,/^[a-f0-9]{32}$/i,'Invalid Cloudflare account identifier');
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT}/pages/projects/magius3dviewer`,{headers:{Authorization:`Bearer ${process.env.CF_TOKEN}`},redirect:'error',signal:AbortSignal.timeout(30000)});
          assert.equal(r.status,200,'Cannot access existing Cloudflare project');
          const data=await r.json();
          assert.ok(data.success && data.result?.name==='magius3dviewer');
          const branch=data.result.production_branch;
          assert.match(branch,/^[A-Za-z0-9_./-]+$/);
          const h=await fetch('https://magius3dviewer-runtime-products.crynetsystemscell.workers.dev/healthz',{signal:AbortSignal.timeout(60000)});
          assert.equal(h.status,200,'Private-release gateway is not ready; fix its server-side credential before publishing');
          assert.equal((await h.json()).status,'ready');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`branch=${branch}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Target: existing Cloudflare project magius3dviewer; production branch ${branch}. No GitHub Pages deployment.\n`);
          NODE
  build:
    needs: configuration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: magius3dviewer-live
      url: https://magius3dviewer.pages.dev/
    # Full candidate + production WebGL suites use software rendering on hosted
    # runners. The measured 75-minute run reached the final landing cases; retain
    # every gate and budget time for those cases instead of canceling mid-check.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p /tmp/site-evidence
      - run: npm ci
      - name: Dependency security report (advisory)
        continue-on-error: true
        run: npm audit --json > /tmp/site-evidence/npm-audit.json
      - name: Pose, selection, IK, resource transport and private gateway regressions
        run: |
          set -euo pipefail
          node --test loadingPaintIndependence.test.mjs
          npm run test:website 2>&1 | tee /tmp/site-evidence/functional-tests.log
      - name: Complete production typecheck
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/site-evidence/types.log
      - name: Build current client with complete Cloudflare stage closures
        env:
          MAGIUS_DEPLOY_TARGET: cloudflare
        run: |
          set -euo pipefail
          node scripts/build-deployment.mjs 2>&1 | tee /tmp/site-evidence/build.log
      - name: Verify real pointer interaction, skinning and multi-character rendering
        run: |
          set -euo pipefail
          node scripts/site-smoke-pose.mjs 2>&1 | tee /tmp/site-evidence/browser.log
      - name: Verify full stage delivery with direct repository requests blocked
        run: |
          set -euo pipefail
          node scripts/site-smoke-cloudflare.mjs 2>&1 | tee /tmp/site-evidence/cloudflare-browser.log
      - name: Verify persistent viewport editing, bounded joints and ground contact
        env:
          MAGIUS_EVIDENCE_DIR: /tmp/site-evidence/viewport
        run: node scripts/site-smoke-viewport.mjs
      # Keep the exact tested package on this runner; do not upload a multi-GB
      # intermediate artifact against the private repository storage allowance.
      - name: Publish full verified website to the existing Cloudflare production branch
        if: ${{ success() && github.ref == 'refs/heads/main' && needs.configuration.result == 'success' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          command: pages deploy dist-deploy --project-name=magius3dviewer --branch=${{ needs.configuration.outputs.branch }} --commit-hash=${{ github.sha }}
      - name: Verify actual production version and current scene route
        if: ${{ success() && github.ref == 'refs/heads/main' && needs.configuration.result == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const site='https://magius3dviewer.pages.dev/';
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          let verified=false;
          for(let i=0;i<18;i++){
            try{
              const q='?revision='+process.env.GITHUB_SHA;
              const r=await fetch(site+'site-version.json'+q,{signal:AbortSignal.timeout(30000)});
              const c=await fetch(site+'catalogs/runtime-product-delivery.v1.json'+q,{signal:AbortSignal.timeout(30000)});
              const v=await r.json(),catalog=await c.json();
              assert.equal(r.status,200);assert.equal(c.status,200);
              assert.equal(v.revision,process.env.GITHUB_SHA);assert.equal(catalog.bundledStageBaseUrl,undefined);
              const index=await fetch(site+'index.html'+q,{signal:AbortSignal.timeout(30000)});
              assert.equal(index.status,200);
              assert.equal(hash(Buffer.from(await index.arrayBuffer())),hash(fs.readFileSync('dist-deploy/index.html')));
              verified=true;break;
            }catch{await new Promise(resolve=>setTimeout(resolve,5000));}
          }
          assert.ok(verified,'Cloudflare production did not serve the tested revision');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Published Cloudflare production: ${site}\nApplication revision: ${process.env.GITHUB_SHA}\nCurrent scenes are same-origin; private Release products use the existing server-side gateway.\n`);
          NODE
      - name: Verify real browser against the public Cloudflare site
        if: ${{ success() && github.ref == 'refs/heads/main' && needs.configuration.result == 'success' }}
        env:
          MAGIUS_SITE_URL: https://magius3dviewer.pages.dev/
        run: |
          mkdir -p /tmp/site-evidence
          node scripts/site-smoke-cloudflare.mjs
          MAGIUS_EVIDENCE_DIR=/tmp/site-evidence/production-viewport node scripts/site-smoke-viewport.mjs
          MAGIUS_EVIDENCE_DIR=/tmp/site-evidence/entry-landing node scripts/site-smoke-entry-landing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-delivery-evidence
          path: /tmp/site-evidence/
          retention-days: 7
