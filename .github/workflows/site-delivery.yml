name: Deploy tested website
on:
  push:
    branches: [magius3dviewer]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-website-delivery
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p /tmp/site-evidence
      - run: npm ci
      - name: Dependency security report (advisory)
        continue-on-error: true
        run: npm audit --json > /tmp/site-evidence/npm-audit.json
      - name: Pose, selection and IK functional regressions
        run: |
          set -euo pipefail
          node --test directPoseManipulation.test.mjs viewerSelectionEditing.test.mjs performanceChainIK.test.mjs 2>&1 | tee /tmp/site-evidence/pose-tests.log
      - name: Complete production typecheck
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/site-evidence/types.log
      - name: Build current client and package runtime resources
        env:
          MAGIUS_DEPLOY_LIGHTWEIGHT: '1'
          MAGIUS_DEPLOY_OUT_DIR: dist-deploy
        run: |
          set -euo pipefail
          node scripts/build-deployment.mjs 2>&1 | tee /tmp/site-evidence/build.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('dist-deploy/site-version.json', JSON.stringify({revision:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),poseEditor:'bounded-ik-v2',selection:'existing-outline-uniforms'})+'\n');
          NODE
      - name: Install isolated browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Verify real pointer interaction, skinning and multi-character rendering
        run: |
          set -euo pipefail
          node scripts/site-smoke-pose.mjs 2>&1 | tee /tmp/site-evidence/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-delivery-evidence
          path: /tmp/site-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: verified-website
          path: dist-deploy/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-deploy/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: pages
      - name: Verify the published revision
        env:
          SITE_URL: ${{ steps.pages.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          let verified=false;
          for(let i=0;i<18;i++) {
            try { const r=await fetch(new URL('site-version.json?revision='+process.env.EXPECTED_SHA,process.env.SITE_URL)); const v=await r.json(); if(r.ok && v.revision===process.env.EXPECTED_SHA){console.log('Verified published revision',v);verified=true;break;} } catch { console.log('Waiting for Pages propagation'); }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!verified) throw new Error('Published revision does not match tested source');
          NODE
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-website
          path: dist-deploy
      - name: Resolve existing Cloudflare production project
        id: project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if(!process.env.CF_TOKEN || !process.env.CF_ACCOUNT) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Cloudflare was not published: this repository/environment does not provide the configured Pages API token and account ID. The existing Cloudflare website was left unchanged.\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'configured=false\n');
          } else {
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT}/pages/projects/magius3dviewer`,{headers:{Authorization:`Bearer ${process.env.CF_TOKEN}`}});
            const data=await r.json();
            if(!r.ok || !data.success || !data.result?.production_branch)throw new Error('Cannot resolve the existing Cloudflare production project');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`configured=true\nbranch=${data.result.production_branch}\n`);
          }
          NODE
      - name: Publish verified assets to the existing Cloudflare project
        if: steps.project.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-deploy --project-name=magius3dviewer --branch=${{ steps.project.outputs.branch }}
      - name: Verify Cloudflare published revision
        if: steps.project.outputs.configured == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          for(let i=0;i<18;i++){
            try{const r=await fetch('https://magius3dviewer.pages.dev/site-version.json?revision='+process.env.EXPECTED_SHA);const v=await r.json();if(r.ok&&v.revision===process.env.EXPECTED_SHA){console.log('Cloudflare revision verified',v.revision);process.exit(0)}}catch{}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw new Error('Cloudflare has not published the tested revision');
          NODE
