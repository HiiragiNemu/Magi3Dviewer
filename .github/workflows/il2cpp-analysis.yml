name: Analyze Exedra IL2CPP shader systems

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/il2cpp-analysis.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            .github/workflows/il2cpp-analysis.yml

      - name: Download processed IL2CPP dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/il2cpp analysis
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/il2cpp/dump.processed.cs \
            https://raw.githubusercontent.com/thefrozenfishy/ma-ex-data/main/il2cpp_reverse_engineering/dump.processed.cs
          wc -c -l /tmp/il2cpp/dump.processed.cs | tee analysis/source-size.txt

      - name: Extract official shader and scene evidence
        shell: python
        run: |
          from __future__ import annotations

          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          source = Path('/tmp/il2cpp/dump.processed.cs')
          text = source.read_text(encoding='utf-8', errors='replace')
          lines = text.splitlines()

          namespace_re = re.compile(r'^\s*namespace\s+([^\s{]+)')
          type_re = re.compile(
              r'^\s*(?:public|private|protected|internal)?\s*'
              r'(?:(?:abstract|sealed|static|partial)\s+)*'
              r'(class|struct|interface|enum)\s+([A-Za-z_][A-Za-z0-9_`.]*)'
              r'(?:\s*:\s*([^\{]+))?'
          )
          member_re = re.compile(
              r'^\s*(?:public|private|protected|internal)\s+(.+?)(?:;|\{|=>)'
          )
          property_re = re.compile(r'(?i)(?:Shader\.)?PropertyToID\s*\(\s*"([^"]+)"')
          string_re = re.compile(r'"((?:\\.|[^"\\])*)"')

          categories = {
              'redrive_toon': re.compile(r'(?i)redrive|rdtoon|toon'),
              'angel_ring': re.compile(r'(?i)angel\s*ring|angelring'),
              'rim_fresnel': re.compile(r'(?i)rim\s*light|rimlight|fresnel'),
              'material_features': re.compile(r'(?i)matcap|anisotrop|metallic.?gradient|specular|gem|cosmic'),
              'face_hair': re.compile(r'(?i)face.?shadow|eye.?highlight|hair.?highlight|hair'),
              'shader_api': re.compile(r'(?i)shaderproperty|materialpropertyblock|propertytoid|setfloat|setcolor|settexture|setvector'),
              'stage_scene': re.compile(r'(?i)battle.?stage|dungeon|field|bg3d|stage.?loader|scene.?loader|loadscene|addressable|assetbundle'),
              'timeline_camera': re.compile(r'(?i)playabledirector|timeline|camera.?path|animationclip'),
          }

          type_spans = []
          namespace = ''
          for i, line in enumerate(lines):
              ns = namespace_re.match(line)
              if ns:
                  namespace = ns.group(1)
              tm = type_re.match(line)
              if tm:
                  kind, name, bases = tm.groups()
                  type_spans.append({
                      'start': i,
                      'kind': kind,
                      'name': name,
                      'namespace': namespace,
                      'bases': (bases or '').strip(),
                      'declaration': line.strip(),
                  })
          for i, entry in enumerate(type_spans):
              entry['end'] = type_spans[i + 1]['start'] - 1 if i + 1 < len(type_spans) else len(lines) - 1

          def owner_at(index):
              lo, hi = 0, len(type_spans) - 1
              owner = None
              while lo <= hi:
                  mid = (lo + hi) // 2
                  if type_spans[mid]['start'] <= index:
                      owner = type_spans[mid]
                      lo = mid + 1
                  else:
                      hi = mid - 1
              return owner if owner and index <= owner['end'] else None

          hits = []
          counts = Counter()
          by_type = defaultdict(lambda: {'categories': Counter(), 'hits': []})
          properties = []
          literals = []

          for index, line in enumerate(lines):
              matched = [name for name, pattern in categories.items() if pattern.search(line)]
              if not matched:
                  continue
              owner = owner_at(index)
              owner_name = owner['name'] if owner else None
              hit = {
                  'line': index + 1,
                  'text': line.strip(),
                  'categories': matched,
                  'type': owner_name,
                  'namespace': owner['namespace'] if owner else None,
                  'context': [
                      {'line': j + 1, 'text': lines[j]}
                      for j in range(max(0, index - 4), min(len(lines), index + 5))
                  ],
              }
              hits.append(hit)
              counts.update(matched)
              if owner_name:
                  by_type[owner_name]['categories'].update(matched)
                  if len(by_type[owner_name]['hits']) < 240:
                      by_type[owner_name]['hits'].append({'line': index + 1, 'text': line.strip()})
              for value in property_re.findall(line):
                  properties.append({'value': value, 'line': index + 1, 'type': owner_name, 'text': line.strip()})
              for value in string_re.findall(line):
                  if re.search(r'(?i)(^_|angel|rim|fresnel|toon|matcap|anisotrop|metal|spec|shadow|face|hair|gem|cosmic|stage|dungeon|bg3d)', value):
                      literals.append({'value': value, 'line': index + 1, 'type': owner_name, 'text': line.strip()})

          relevant_types = []
          for entry in type_spans:
              evidence = by_type.get(entry['name'])
              if not evidence:
                  continue
              members = []
              for index in range(entry['start'] + 1, min(entry['end'] + 1, entry['start'] + 1500)):
                  match = member_re.match(lines[index])
                  if match:
                      members.append({'line': index + 1, 'text': lines[index].strip()})
              relevant_types.append({
                  **entry,
                  'categories': dict(evidence['categories']),
                  'matching_lines': evidence['hits'],
                  'members': members[:600],
              })

          weights = {
              'angel_ring': 40,
              'redrive_toon': 25,
              'rim_fresnel': 25,
              'material_features': 16,
              'stage_scene': 10,
              'timeline_camera': 8,
              'shader_api': 2,
              'face_hair': 3,
          }
          relevant_types.sort(
              key=lambda item: sum(weights.get(key, 1) * value for key, value in item['categories'].items()),
              reverse=True,
          )

          output = Path('analysis')
          result = {
              'source': 'thefrozenfishy/ma-ex-data/il2cpp_reverse_engineering/dump.processed.cs',
              'lines': len(lines),
              'characters': len(text),
              'declared_types': len(type_spans),
              'category_counts': dict(counts),
              'relevant_types': relevant_types,
              'property_ids': properties,
              'shader_like_literals': literals,
              'hits': hits,
          }
          (output / 'il2cpp-analysis.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          md = [
              '# Exedra IL2CPP shader and scene analysis', '',
              f'- Lines: **{len(lines):,}**',
              f'- Types: **{len(type_spans):,}**',
              f'- Relevant hits: **{len(hits):,}**',
              f'- PropertyToID hits: **{len(properties):,}**', '',
              '## Categories', '',
          ]
          md.extend(f'- `{name}`: {count}' for name, count in counts.most_common())
          md.extend(['', '## Ranked relevant classes', ''])
          for item in relevant_types[:250]:
              full_name = f"{item['namespace']}.{item['name']}" if item['namespace'] else item['name']
              md += [
                  f"### `{full_name}`", '',
                  f"- Declaration: `{item['declaration']}`",
                  f"- Categories: `{item['categories']}`",
              ]
              if item['members']:
                  md.append('- Members:')
                  md.extend(f"  - L{m['line']}: `{m['text']}`" for m in item['members'][:140])
              if item['matching_lines']:
                  md.append('- Matching lines:')
                  md.extend(f"  - L{m['line']}: `{m['text']}`" for m in item['matching_lines'][:100])
              md.append('')

          md += ['## Property names and shader-like literals', '']
          seen = set()
          for item in properties + literals:
              key = (item['value'], item.get('type'))
              if key in seen:
                  continue
              seen.add(key)
              md.append(f"- `{item['value']}` — `{item.get('type')}` L{item['line']}")
          (output / 'IL2CPP_ANALYSIS.md').write_text('\n'.join(md) + '\n', encoding='utf-8')

          summary = {
              'line_count': len(lines),
              'type_count': len(type_spans),
              'hit_count': len(hits),
              'category_counts': dict(counts),
              'top_types': [
                  {
                      'name': item['name'],
                      'namespace': item['namespace'],
                      'categories': item['categories'],
                      'declaration': item['declaration'],
                  }
                  for item in relevant_types[:80]
              ],
              'property_names': sorted({item['value'] for item in properties + literals})[:3000],
          }
          (output / 'il2cpp-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: exedra-il2cpp-shader-analysis
          path: analysis
          retention-days: 14

      - name: Publish status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'Exedra IL2CPP shader analysis',
              description: success
                ? 'Shader, AngelRing and 3D-scene classes analyzed'
                : 'IL2CPP analysis failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
