name: Extract Taiwan host literals
run-name: Recover Taiwan production host and endpoint strings

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/tw-host-literals.yml'
      - 'analysis-requests/tw-host-literals.txt'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'
      - name: Download and unpack Taiwan client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip jq
          mkdir -p work/source work/xapk work/merged work/report work/tool work/dump
          curl -fL --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
            'https://d.apkpure.net/b/XAPK/tw.sonet.magiaexedra?version=latest' \
            -o work/source/client.xapk
          sha256sum work/source/client.xapk > work/report/xapk-sha256.txt
          unzip -q work/source/client.xapk -d work/xapk
          while IFS= read -r -d '' apk; do unzip -q -o "$apk" -d work/merged; done \
            < <(find work/xapk -type f -name '*.apk' -print0 | sort -z)
      - name: Generate and filter string literals
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest)
          asset=$(jq -r '[.assets[] | select(.name | test("net6.*\\.zip$"; "i"))][0].browser_download_url // empty' <<< "$release")
          curl -fL --retry 4 "$asset" -o work/tool/tool.zip
          unzip -q work/tool/tool.zip -d work/tool/extracted
          dll=$(find work/tool/extracted -type f -name Il2CppDumper.dll -print -quit)
          set +e
          dotnet "$dll" work/merged/lib/arm64-v8a/libil2cpp.so \
            work/merged/assets/bin/Data/Managed/Metadata/global-metadata.dat \
            work/dump </dev/null > work/report/dumper.log 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >> work/report/dumper.log
          test -s work/dump/stringliteral.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=json.loads(Path('work/dump/stringliteral.json').read_text(encoding='utf-8'))
          host=re.compile(r'(?i)(https?://|(?:[a-z0-9-]+\.)+(?:tw|jp|net|com|games)(?::\d+)?|/api/|masterDataApiPath|webResourcesUrl|appResourceUrl|gameServer|production|staging|judgement|gcs_signed_url|akamai)')
          out=[row for row in rows if host.search(str(row.get('Value','')))]
          Path('work/report/host-literals.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('work/report/host-literals.txt').write_text('\n'.join(f"{r.get('Address')}\t{r.get('Value')}" for r in out)+'\n',encoding='utf-8')
          PY
      - name: Remove raw files
        if: ${{ always() }}
        run: rm -rf work/source work/xapk work/merged work/tool work/dump
      - name: Upload host literals
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tw-host-literals
          path: work/report
          retention-days: 14
          if-no-files-found: error
