name: Extract official 100101 material properties

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-official-100101-material-properties.txt'

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: research/100101-official-material-properties-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded extractor dependencies
        run: python -m pip install requests msgpack pycryptodome UnityPy
      - name: Extract target Material saved properties from official JP bundles
        run: python scripts/run_official_100101_material_properties.py
      - name: Record UnityPy modern Shader-export compatibility result
        run: python scripts/extract_official_100101_shader_formula_evidence.py
      - name: Inspect modern ReDrive Shader serialized blob tables
        run: python scripts/inspect_modern_redrive_shader_blob.py
      - name: Summarize modern Shader program/blob tables
        run: python scripts/summarize_modern_redrive_shader_blob.py
      - name: Probe SJ MatCap across character plus shader workspace
        run: python scripts/resolve_official_100101_matcap_dependency.py
      - name: Persist bounded Material/Shader/MatCap evidence only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/official-100101-material-properties.json \
            research/official-100101-redrive-shader-evidence.json \
            research/official-redrive-modern-shader-blob.json \
            research/official-redrive-modern-shader-blob-summary.json \
            research/official-100101-matcap-resolution.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: summarize modern ReDrive Shader and SJ MatCap dependencies'
          git push origin HEAD:${TARGET_BRANCH}
