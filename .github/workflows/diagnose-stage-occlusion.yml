name: Diagnose official stage occlusion

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/diagnose-stage-occlusion.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

# This workflow is diagnostic-only and never receives Pages permissions.
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Magius3Dviewer source branch
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production candidate
        run: npm run build

      - name: Install browser diagnostic driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Diagnose large gray stage occluders
        id: diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/magius-stage-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          sleep 4
          node scripts/diagnose-stage-occlusion.mjs

      - name: Upload stage occlusion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: magius-stage-occlusion-diagnostic
          path: |
            /tmp/magius-stage-occlusion.json
            /tmp/magius-stage-occlusion-*.png
            /tmp/magius-stage-preview.log
          if-no-files-found: warn
          retention-days: 7

      - name: Persist machine-readable report
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'automation/stage-occlusion-diagnostic';
            const path = 'reports/latest-stage-occlusion.json';
            let payload;
            if (fs.existsSync('/tmp/magius-stage-occlusion.json')) {
              payload = fs.readFileSync('/tmp/magius-stage-occlusion.json', 'utf8');
            } else {
              payload = JSON.stringify({
                generatedAt: new Date().toISOString(),
                diagnosticOutcome: '${{ steps.diagnostic.outcome }}',
                previewLog: fs.existsSync('/tmp/magius-stage-preview.log')
                  ? fs.readFileSync('/tmp/magius-stage-preview.log', 'utf8')
                  : 'No diagnostic report or preview log was produced',
              }, null, 2) + '\n';
            }
            let branchSha;
            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              branchSha = ref.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              const base = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              });
              branchSha = base.data.commit.sha;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: branchSha,
              });
            }
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: 'diagnostic: update official stage occlusion report',
              content: Buffer.from(payload).toString('base64'),
              sha: existingSha,
            });

      - name: Keep diagnostic non-deploying
        run: echo 'Diagnostic completed. This workflow never deploys Pages.'
