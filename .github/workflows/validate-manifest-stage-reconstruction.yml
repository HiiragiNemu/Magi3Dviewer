name: Validate manifest-driven stage reconstruction

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-manifest-stage-reconstruction.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feature/manifest-driven-stage-reconstruction-20260807
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply authoritative manifest patch
        run: python scripts/apply_manifest_stage_patch.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release tests and production build
        run: npm run build

      - name: Persist validated source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/viewer/stages.ts public/stages/catalog.json
          if git diff --cached --quiet; then
            echo 'Manifest-driven changes already current.'
            exit 0
          fi
          git commit -m 'feat: bind stages to authoritative AssetBundle roots'
          git push origin HEAD:${TARGET_BRANCH}
