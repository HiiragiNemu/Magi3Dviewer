name: Recover Taiwan runtime literals
run-name: Resolve MsgPack keys GuestLogin URLs and salts

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/tw-runtime-literals-final.yml'
      - 'analysis-requests/tw-runtime-literals-final.txt'

permissions:
  contents: read

concurrency:
  group: tw-runtime-literals-final
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Download client and Cpp2IL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p work/source work/xapk work/unpacked work/tool work/query/runtime work/report
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/tw.sonet.magiaexedra?version=latest' \
            -o work/source/client.xapk
          sha256sum work/source/client.xapk > work/report/xapk-sha256.txt
          unzip -q work/source/client.xapk -d work/xapk
          while IFS= read -r -d '' apk; do unzip -q -o "$apk" -d work/unpacked; done \
            < <(find work/xapk -type f -name '*.apk' -print0 | sort -z)
          test -s work/unpacked/lib/arm64-v8a/libil2cpp.so
          test -s work/unpacked/assets/bin/Data/Managed/Metadata/global-metadata.dat
          curl -fL --retry 4 --retry-all-errors \
            'https://nightly.link/SamboyCoding/Cpp2IL/workflows/dotnet-core/development/Cpp2IL-net9-linux-x64.zip' \
            -o work/tool/cpp2il.zip
          unzip -q work/tool/cpp2il.zip -d work/tool/extracted
          find work/tool/extracted -type f -printf '%P\t%s\n' | sort > work/report/cpp2il-runtime-inventory.tsv
          find work/tool/extracted -type f \( -name '*.dll' -o -name '*.json' \) -exec cp -n '{}' work/query/runtime/ \;
          test -s work/query/runtime/LibCpp2IL.dll
      - name: Build reflection-only query
        shell: bash
        run: |
          set -euo pipefail
          cat > work/query/RuntimeLiteralQuery.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net9.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat > work/query/Program.cs <<'EOF'
          using System.Reflection;
          using System.Text.Json;

          if (args.Length != 4)
              throw new ArgumentException("runtime-dir binary metadata output");

          var runtimeDir = Path.GetFullPath(args[0]);
          var binary = File.ReadAllBytes(args[1]);
          var metadata = File.ReadAllBytes(args[2]);
          var output = args[3];

          AppDomain.CurrentDomain.AssemblyResolve += (_, eventArgs) =>
          {
              var simpleName = new AssemblyName(eventArgs.Name).Name;
              var candidate = Path.Combine(runtimeDir, simpleName + ".dll");
              return File.Exists(candidate) ? Assembly.LoadFrom(candidate) : null;
          };

          var libAssembly = Assembly.LoadFrom(Path.Combine(runtimeDir, "LibCpp2IL.dll"));
          foreach (var dependency in Directory.EnumerateFiles(runtimeDir, "*.dll"))
          {
              try { Assembly.LoadFrom(dependency); } catch { }
          }

          var unityAssembly = AppDomain.CurrentDomain.GetAssemblies()
              .FirstOrDefault(a => a.GetType("AssetRipper.Primitives.UnityVersion") != null)
              ?? Assembly.LoadFrom(Path.Combine(runtimeDir, "AssetRipper.Primitives.dll"));
          var unityType = unityAssembly.GetType("AssetRipper.Primitives.UnityVersion", true)!;
          var unityVersionType = unityAssembly.GetType("AssetRipper.Primitives.UnityVersionType", true)!;
          var finalEnum = Enum.Parse(unityVersionType, "Final");
          var unityVersion = Activator.CreateInstance(
              unityType,
              new object[] { 2022, 3, 62, finalEnum, 3 }
          )!;

          var builderType = libAssembly.GetType("LibCpp2IL.LibCpp2IlContextBuilder", true)!;
          var build = builderType.GetMethods(BindingFlags.Public | BindingFlags.Static)
              .Single(m => m.Name == "Build" && m.GetParameters().Length == 3);
          var context = build.Invoke(null, new[] { binary, metadata, unityVersion })!;
          var getLiteral = context.GetType().GetMethod(
              "GetLiteralByAddress",
              BindingFlags.Public | BindingFlags.Instance,
              binder: null,
              types: new[] { typeof(ulong) },
              modifiers: null
          ) ?? throw new MissingMethodException("GetLiteralByAddress(ulong)");

          var slots = new Dictionary<string, ulong>
          {
              ["systemMonitorOrEmpty"] = 0x9B7A4F0,
              ["msgPackDefaultCryptKey"] = 0x9BA5660,
              ["appMsgPackCryptKey"] = 0x9BCB028,
              ["appCryptoHashKeyInput"] = 0x9BCAF80,
              ["appCryptoHashSaltInput"] = 0x9BCAF88,
              ["appCryptoSeedInput"] = 0x9BCAF90,
              ["guestApiOrigin"] = 0x9B83D68,
              ["guestLoginSuffix"] = 0x9B83D50,
              ["guestRegisterSuffix"] = 0x9B84008,
              ["guestUserAgentHeader"] = 0x9B83D58,
              ["guestSavedGuidKey"] = 0x9B7A538,
              ["guestSavedUuidKey"] = 0x9B831F8,
              ["guestCallbackType"] = 0x9B83FC0,
              ["sdkScheme"] = 0x9B8CAD0,
              ["sdkPackage"] = 0x9B93118,
              ["productionDomainPart"] = 0x9B8CAC0,
              ["sdkRequestSignSalt"] = 0x9C09490,
          };
          var values = new List<object>();
          foreach (var pair in slots)
          {
              object? value = null;
              string? error = null;
              try { value = getLiteral.Invoke(context, new object[] { pair.Value }); }
              catch (Exception exception)
              {
                  var actual = exception is TargetInvocationException tie && tie.InnerException != null
                      ? tie.InnerException
                      : exception;
                  error = actual.GetType().Name + ": " + actual.Message;
              }
              values.Add(new
              {
                  name = pair.Key,
                  address = $"0x{pair.Value:X}",
                  value,
                  error,
              });
          }
          var report = new
          {
              schemaVersion = 3,
              client = new
              {
                  package = "tw.sonet.magiaexedra",
                  appVersion = "1.0.5",
                  unityVersion = "2022.3.62f3",
              },
              values,
          };
          File.WriteAllText(
              output,
              JsonSerializer.Serialize(report, new JsonSerializerOptions { WriteIndented = true }) + "\n"
          );
          EOF
          dotnet build work/query/RuntimeLiteralQuery.csproj --configuration Release --nologo \
            > work/report/build.log 2>&1
          cp work/query/runtime/* work/query/bin/Release/net9.0/
      - name: Query exact runtime literals
        shell: bash
        run: |
          set -euo pipefail
          dotnet work/query/bin/Release/net9.0/RuntimeLiteralQuery.dll \
            work/query/bin/Release/net9.0 \
            work/unpacked/lib/arm64-v8a/libil2cpp.so \
            work/unpacked/assets/bin/Data/Managed/Metadata/global-metadata.dat \
            work/report/runtime-literals.json \
            > work/report/query.log 2>&1
          test -s work/report/runtime-literals.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/report/runtime-literals.json').read_text(encoding='utf-8'))
          values={item['name']:item for item in report['values']}
          required=('appMsgPackCryptKey','appCryptoHashKeyInput','appCryptoHashSaltInput','appCryptoSeedInput')
          missing=[name for name in required if values[name].get('value') is None]
          Path('work/report/runtime-literals.txt').write_text('\n'.join(f"{item['name']}\t{item['address']}\t{item.get('value')!r}\t{item.get('error') or ''}" for item in report['values'])+'\n',encoding='utf-8')
          print(Path('work/report/runtime-literals.txt').read_text(encoding='utf-8'))
          if missing: raise SystemExit(f'missing required literals: {missing}')
          PY
      - name: Remove raw/full materials
        if: ${{ always() }}
        run: |
          rm -rf work/source work/xapk work/unpacked work/tool work/query
          find work/report -type f -printf '%P\t%s\n' | sort > work/report/report-inventory.tsv
      - name: Upload runtime literals
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tw-runtime-literals-final
          path: work/report
          retention-days: 14
          if-no-files-found: error
