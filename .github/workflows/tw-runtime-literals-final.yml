name: Recover Taiwan runtime literals
run-name: Resolve MsgPack keys GuestLogin URLs and salts

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/tw-runtime-literals-final.yml'
      - 'analysis-requests/tw-runtime-literals-final.txt'

permissions:
  contents: read

concurrency:
  group: tw-runtime-literals-final
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Download and unpack Taiwan client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip python3-pip
          python -m pip install --disable-pip-version-check pyelftools
          mkdir -p work/source work/xapk work/unpacked work/report
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/tw.sonet.magiaexedra?version=latest' \
            -o work/source/client.xapk
          sha256sum work/source/client.xapk > work/report/xapk-sha256.txt
          unzip -q work/source/client.xapk -d work/xapk
          while IFS= read -r -d '' apk; do unzip -q -o "$apk" -d work/unpacked; done \
            < <(find work/xapk -type f -name '*.apk' -print0 | sort -z)
          test -s work/unpacked/lib/arm64-v8a/libil2cpp.so
          test -s work/unpacked/assets/bin/Data/Managed/Metadata/global-metadata.dat
      - name: Resolve runtime string usage slots
        shell: python
        run: |
          from pathlib import Path
          import json,struct
          from elftools.elf.elffile import ELFFile
          from elftools.elf.relocation import RelocationSection

          binary_path=Path('work/unpacked/lib/arm64-v8a/libil2cpp.so')
          metadata=Path('work/unpacked/assets/bin/Data/Managed/Metadata/global-metadata.dat').read_bytes()
          magic,version=struct.unpack_from('<II',metadata,0)
          if magic != 0xFAB11BAF: raise SystemExit(f'bad metadata magic {magic:#x}')
          literal_offset,literal_size,literal_data_offset,literal_data_size=struct.unpack_from('<IIII',metadata,8)
          slots={
              'systemMonitorOrEmpty':0x9B7A4F0,
              'msgPackDefaultCryptKey':0x9BA5660,
              'appMsgPackCryptKey':0x9BCB028,
              'appCryptoHashKeyInput':0x9BCAF80,
              'appCryptoHashSaltInput':0x9BCAF88,
              'appCryptoSeedInput':0x9BCAF90,
              'guestApiOrigin':0x9B83D68,
              'guestLoginSuffix':0x9B83D50,
              'guestRegisterSuffix':0x9B84008,
              'guestUserAgentHeader':0x9B83D58,
              'guestSavedGuidKey':0x9B7A538,
              'guestSavedUuidKey':0x9B831F8,
              'guestCallbackType':0x9B83FC0,
              'sdkScheme':0x9B8CAD0,
              'sdkPackage':0x9B93118,
              'productionDomainPart':0x9B8CAC0,
              'sdkRequestSignSalt':0x9C09490,
          }
          required={'appMsgPackCryptKey','appCryptoHashKeyInput','appCryptoHashSaltInput','appCryptoSeedInput'}
          wanted=set(slots.values())

          def map_va(elf,address):
              for segment in elf.iter_segments():
                  if segment['p_type']!='PT_LOAD': continue
                  start=int(segment['p_vaddr']); filesz=int(segment['p_filesz']); memsz=int(segment['p_memsz'])
                  if start<=address<start+memsz:
                      delta=address-start
                      return None if delta>=filesz else int(segment['p_offset'])+delta
              return None

          with binary_path.open('rb') as stream:
              elf=ELFFile(stream); usage_pointers={}; relocation_info={}
              for section in elf.iter_sections():
                  if not isinstance(section,RelocationSection): continue
                  symtab=elf.get_section(section['sh_link']) if section['sh_link'] else None
                  for rel in section.iter_relocations():
                      slot=int(rel['r_offset'])
                      if slot not in wanted: continue
                      addend=int(rel.entry.get('r_addend',0)); symval=0; symidx=int(rel['r_info_sym']); symname=''
                      if symtab is not None and symidx:
                          symbol=symtab.get_symbol(symidx); symval=int(symbol['st_value']); symname=symbol.name
                      usage_pointers[slot]=(symval+addend)&0xffffffffffffffff
                      relocation_info[slot]={'section':section.name,'type':int(rel['r_info_type']),'addend':addend,'symbol':symname}

              results={}
              for name,slot in slots.items():
                  record={'slot':f'0x{slot:X}','relocation':relocation_info.get(slot)}
                  try:
                      usage=usage_pointers.get(slot)
                      if usage is None: raise ValueError('no relocation for slot')
                      record['usageAddress']=f'0x{usage:X}'
                      raw=map_va(elf,usage)
                      if raw is None: raise ValueError('usage pointer is not file-backed')
                      stream.seek(raw+16)
                      encoded=struct.unpack('<I',stream.read(4))[0]
                      usage_type=(encoded&0xE0000000)>>29
                      source_offset=(encoded&0x1FFFFFFF)>>1
                      record.update({'token':f'0x{encoded:08X}','usageType':usage_type,'sourceOffset':source_offset})
                      if usage_type != 5: raise ValueError(f'usage type is {usage_type}, expected 5')
                      descriptor=literal_offset+source_offset
                      if descriptor<literal_offset or descriptor+8>literal_offset+literal_size:
                          raise ValueError('literal descriptor byte offset is out of bounds')
                      length,data_index=struct.unpack_from('<II',metadata,descriptor)
                      data_start=literal_data_offset+data_index; data_stop=data_start+length
                      if data_stop>literal_data_offset+literal_data_size: raise ValueError('literal data is out of bounds')
                      record.update({'length':length,'dataIndex':data_index,'value':metadata[data_start:data_stop].decode('utf-8',errors='strict')})
                  except Exception as exc:
                      record['error']=repr(exc)
                  results[name]=record

          missing=sorted(name for name in required if 'value' not in results[name])
          report={'schemaVersion':2,'metadataVersion':version,'xapkSha256':'9ed2f73182e0e6369f757124570b36cac3ba8dcd6a545a6e4e19881d53ff084a','missingRequired':missing,'values':results}
          Path('work/report/runtime-literals.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('work/report/runtime-literals.txt').write_text('\n'.join(f"{name}\t{item.get('slot')}\t{item.get('token')}\t{item.get('value')!r}\t{item.get('error','')}" for name,item in results.items())+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if missing: raise SystemExit(f'missing required literals: {missing}')
      - name: Remove raw/full materials
        if: ${{ always() }}
        run: |
          rm -rf work/source work/xapk work/unpacked
          find work/report -type f -printf '%P\t%s\n' | sort > work/report/report-inventory.tsv
      - name: Upload runtime literals
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tw-runtime-literals-final
          path: work/report
          retention-days: 14
          if-no-files-found: error
