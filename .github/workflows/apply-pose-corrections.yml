name: Apply packaging compatibility correction
on:
  push:
    branches: [magius3dviewer]
    paths: ['.github/workflows/apply-pose-corrections.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-pose-corrections
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: magius3dviewer
          filter: blob:none
          sparse-checkout: scripts
      - name: Make only the excluded offline texture census advisory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path=Path('scripts/copy-deployment-public.mjs')
          original=path.read_bytes()
          old=b"throw new Error('Shared enemy texture source closure changed after archive generation')"
          new=b"console.warn('ADVISORY: excluded workspace texture census differs from the archived release; bundled texture identity, bytes and all output checks remain required', {actual: sourceEnemyTextures, archive: enemyTextureArchiveClosure})"
          if new not in original:
              actual=subprocess.check_output(['git','hash-object',str(path)]).decode().strip()
              if actual != 'b08e318c240850b2da5ab108e858502bfd458d36' or original.count(old) != 1:
                  raise RuntimeError('Packaging source changed; refusing an ambiguous edit')
              path.write_bytes(original.replace(old,new,1))
          PY
      - name: Check syntax and review exact change
        run: |
          node --check scripts/copy-deployment-public.mjs
          git -c core.whitespace=cr-at-eol diff --check
          git diff -- scripts/copy-deployment-public.mjs
      - name: Commit only this compatibility correction to the current branch
        run: |
          if git diff --quiet -- scripts/copy-deployment-public.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/copy-deployment-public.mjs
          git commit -m 'build: make excluded offline texture census advisory; retain output integrity checks'
          git push origin HEAD:magius3dviewer
