name: Audit character 100107 material evidence

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-character-100107-material-audit.txt'

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: research/character-100107-material-audit-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Audit packaged character resources and FBX strings
        run: python scripts/audit_character_100107_materials.py
      - name: Persist evidence report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/character-100107-material-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record character 100107 material evidence'
          git push origin HEAD:${TARGET_BRANCH}
