name: Apply self-shadow feedback-loop patch

on:
  push:
    branches:
      - fix/fbx-relative-parse-base-url-20260807
    paths:
      - automation/trigger-self-shadow-feedback-loop.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/fbx-relative-parse-base-url-20260807
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply guarded self-shadow sampler detach
        run: python scripts/apply_self_shadow_feedback_loop_patch.py
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add magia-exedra-character-three/scene/selfShadow.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: detach self-shadow sampler during caster pass'
          git push origin HEAD:fix/fbx-relative-parse-base-url-20260807
