name: Repair Magius3Dviewer release
run-name: Fix portrait AngelRing, npm audit and production chunks

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/repair-magius-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magius3dviewer-release-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source branch
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic source repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'magia-exedra-character-three/shaders/hair.ts',
              "    shader.uniforms.uAngelRingAspectFix.value.set(width / height, 1);",
              """    // Fragment coordinates are normalized independently by viewport size.\n    // Use inverse display aspect so one normalized X unit represents the same\n    // physical screen distance as one normalized Y unit. width / height\n    // collapses the projected ring into a diagonal stripe on portrait screens.\n    shader.uniforms.uAngelRingAspectFix.value.set(height / width, 1);""",
          )

          replace_once(
              'angelRingHeadLock.test.mjs',
              """assert.match(\n    shaderSource,\n    /gl_FragCoord\\.xy\\s*\\/\\s*max\\(uAngelRingViewportSize/,\n    'official projection must use fragment screen position',\n);""",
              """assert.match(\n    shaderSource,\n    /gl_FragCoord\\.xy\\s*\\/\\s*max\\(uAngelRingViewportSize/,\n    'official projection must use fragment screen position',\n);\nassert.match(\n    shaderSource,\n    /uAngelRingAspectFix\\.value\\.set\\(height \\/ width, 1\\)/,\n    'portrait-safe AngelRing projection must use inverse display aspect',\n);\nassert.doesNotMatch(\n    shaderSource,\n    /uAngelRingAspectFix\\.value\\.set\\(width \\/ height, 1\\)/,\n    'width / height collapses AngelRing horizontally on portrait screens',\n);""",
          )

          replace_once(
              'scripts/smoke-angelring-two-character.mjs',
              """const page = await browser.newPage()\nawait page.setViewport({ width: 1100, height: 900, deviceScaleFactor: 1 })""",
              """const page = await browser.newPage()\nconst viewportWidth = Number.parseInt(process.env.MAGIUS_VIEWPORT_WIDTH ?? '1100', 10)\nconst viewportHeight = Number.parseInt(process.env.MAGIUS_VIEWPORT_HEIGHT ?? '900', 10)\nconst artifactSuffix = process.env.MAGIUS_ARTIFACT_SUFFIX\n  ? `-${process.env.MAGIUS_ARTIFACT_SUFFIX.replace(/[^a-z0-9_-]+/gi, '-')}`\n  : ''\nif (!Number.isFinite(viewportWidth) || !Number.isFinite(viewportHeight) || viewportWidth <= 0 || viewportHeight <= 0) {\n  throw new Error(`Invalid smoke-test viewport: ${viewportWidth}x${viewportHeight}`)\n}\nawait page.setViewport({ width: viewportWidth, height: viewportHeight, deviceScaleFactor: 1 })""",
          )
          replace_once(
              'scripts/smoke-angelring-two-character.mjs',
              """await page.screenshot({ path: `/tmp/magius-angelring-${slug}-front.png`, fullPage: true })""",
              """await page.screenshot({ path: `/tmp/magius-angelring-${slug}-front${artifactSuffix}.png`, fullPage: true })""",
          )
          replace_once(
              'scripts/smoke-angelring-two-character.mjs',
              """await page.screenshot({ path: `/tmp/magius-angelring-${slug}-back.png`, fullPage: true })""",
              """await page.screenshot({ path: `/tmp/magius-angelring-${slug}-back${artifactSuffix}.png`, fullPage: true })""",
          )
          replace_once(
              'scripts/smoke-angelring-two-character.mjs',
              """const report = {\n  madoka,""",
              """const report = {\n  viewport: { width: viewportWidth, height: viewportHeight },\n  madoka,""",
          )
          replace_once(
              'scripts/smoke-angelring-two-character.mjs',
              """fs.writeFileSync('/tmp/magius-angelring-two-character.json', JSON.stringify(report, null, 2))""",
              """fs.writeFileSync(`/tmp/magius-angelring-two-character${artifactSuffix}.json`, JSON.stringify(report, null, 2))""",
          )

          replace_once(
              'vite.config.ts',
              """    // minify: false,\n    sourcemap: true,""",
              """    // minify: false,\n    sourcemap: true,\n    // Explicit application and vendor budgets are enforced after the build.\n    // This threshold catches accidental recombination while permitting the\n    // isolated Three.js core chunk.\n    chunkSizeWarningLimit: 900,""",
          )
          replace_once(
              'vite.config.ts',
              """      output: {\n        /**""",
              """      output: {\n        manualChunks(id) {\n          const normalized = id.replace(/\\\\/g, '/')\n\n          // Keep the browser entry small and cache the major application\n          // subsystems independently. These checks run before node_modules so\n          // imported assets remain owned by their application subsystem.\n          if (normalized.includes('/magia-exedra-character-three/')) {\n            return 'character-runtime'\n          }\n          if (normalized.includes('/src/viewer/controllers/')) {\n            return 'viewer-controls'\n          }\n          if (normalized.includes('/src/viewer/camera/')) {\n            return 'viewer-camera'\n          }\n          if (normalized.includes('/src/viewer/localization/')) {\n            return 'viewer-localization'\n          }\n          if (normalized.includes('/src/viewer/stage') ||\n              normalized.endsWith('/src/viewer/stages.ts') ||\n              normalized.endsWith('/src/viewer/reDriveVolumeRuntime.ts')) {\n            return 'viewer-stage'\n          }\n\n          if (!normalized.includes('/node_modules/')) return undefined\n          if (normalized.includes('/three/examples/jsm/postprocessing/') ||\n              normalized.includes('/three/examples/jsm/shaders/')) {\n            return 'three-postprocessing'\n          }\n          if (normalized.includes('/three/examples/jsm/loaders/')) return 'three-loaders'\n          if (normalized.includes('/three/examples/jsm/controls/')) return 'three-controls'\n          if (normalized.includes('/three/examples/jsm/libs/')) return 'three-libs'\n          if (normalized.includes('/node_modules/three/')) return 'three-core'\n          if (normalized.includes('/node_modules/@tweenjs/')) return 'tween'\n          if (normalized.includes('/node_modules/fflate/')) return 'fflate'\n          if (normalized.includes('/node_modules/lz-string/')) return 'lz-string'\n          return 'vendor'\n        },\n        /**""",
          )
          PY

      - name: Refresh lockfile within declared semver ranges
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts 2>&1 | tee /tmp/npm-lock-refresh.log
          npm audit fix --package-lock-only --ignore-scripts 2>&1 | tee -a /tmp/npm-lock-refresh.log

      - name: Verify zero audit findings
        shell: bash
        run: |
          npm ci
          npm audit --audit-level=low

      - name: Verify release tests and production chunks
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/magius-repair-build.log
          if grep -q 'Some chunks are larger than' /tmp/magius-repair-build.log; then
            echo 'Vite still reports an oversized JavaScript chunk.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const dir = path.join(process.cwd(), 'dist', 'assets')
          const files = fs.readdirSync(dir)
            .filter(name => name.endsWith('.js'))
            .map(name => ({ name, bytes: fs.statSync(path.join(dir, name)).size }))
            .sort((a, b) => b.bytes - a.bytes)
          const relevant = files.filter(file =>
            /^(index|character-runtime|viewer-|vendor|three-|tween|fflate|lz-string)/.test(file.name),
          )
          console.log(JSON.stringify(relevant, null, 2))

          const modernEntry = files.filter(file =>
            /^index-/.test(file.name) && !/^index-legacy-/.test(file.name),
          )
          if (modernEntry.length !== 1) {
            throw new Error(`Expected one modern entry chunk: ${JSON.stringify(modernEntry)}`)
          }
          if (modernEntry[0].bytes > 500 * 1024) {
            throw new Error(`Modern application entry remains above 500 KiB: ${JSON.stringify(modernEntry)}`)
          }

          const appChunks = files.filter(file =>
            /^(character-runtime|viewer-controls|viewer-camera|viewer-localization|viewer-stage)-/.test(file.name) &&
            !/-legacy-/.test(file.name),
          )
          const oversizedAppChunks = appChunks.filter(file => file.bytes > 650 * 1024)
          if (oversizedAppChunks.length) {
            throw new Error(`Application subsystem chunk exceeds 650 KiB: ${JSON.stringify(oversizedAppChunks)}`)
          }

          const threeCore = files.filter(file => /^three-core-/.test(file.name) && !/-legacy-/.test(file.name))
          if (threeCore.some(file => file.bytes > 850 * 1024)) {
            throw new Error(`Three.js core exceeds 850 KiB: ${JSON.stringify(threeCore)}`)
          }
          NODE

      - name: Commit repaired release source
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            magia-exedra-character-three/shaders/hair.ts \
            angelRingHeadLock.test.mjs \
            scripts/smoke-angelring-two-character.mjs \
            vite.config.ts \
            package-lock.json
          if git diff --cached --quiet; then
            echo 'No source changes were produced.' >&2
            exit 1
          fi
          git commit -m 'fix: restore portrait AngelRing and harden release dependencies'
          git push origin HEAD:magius3dviewer
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request protected Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy-magius3dviewer',
              client_payload: { source_sha: process.env.SOURCE_SHA },
            });
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
