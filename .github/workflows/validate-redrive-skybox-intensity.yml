name: Validate ReDrive skybox intensity runtime

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-redrive-skybox-intensity.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feature/redrive-skybox-intensity-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - run: python scripts/apply_redrive_skybox_intensity_patch.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Persist validated IBL intensity runtime
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/viewer/reDriveVolumeRuntime.ts package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: apply recovered ReDrive skybox intensity to IBL'
          git push origin HEAD:${TARGET_BRANCH}
