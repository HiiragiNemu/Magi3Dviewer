name: Recover Taiwan request response codec
run-name: Decompile exact Pokke encoder decoder and crypto config

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/tw-codec-final.yml'
      - 'tools/research/extract_tw_codec_types.py'
      - 'analysis-requests/tw-codec-final.txt'

permissions:
  contents: read

concurrency:
  group: tw-codec-final
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          dotnet tool install ilspycmd --tool-path work/dotnet-tools
      - name: Download and merge Taiwan XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source work/xapk work/merged work/report work/cpp2il work/output
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/tw.sonet.magiaexedra?version=latest' \
            -o work/source/client.xapk
          sha256sum work/source/client.xapk > work/report/xapk-sha256.txt
          unzip -q work/source/client.xapk -d work/xapk
          while IFS= read -r -d '' apk; do unzip -q -o "$apk" -d work/merged; done \
            < <(find work/xapk -type f -name '*.apk' -print0 | sort -z)
          (cd work/merged && zip -qr ../client.synthetic.apk AndroidManifest.xml assets/bin/Data lib/arm64-v8a/libil2cpp.so)
      - name: Recover and decompile codec types
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            'https://nightly.link/SamboyCoding/Cpp2IL/workflows/dotnet-core/development/Cpp2IL-net9-linux-x64.zip' \
            -o work/cpp2il/tool.zip
          unzip -q work/cpp2il/tool.zip -d work/cpp2il/extracted
          exe=$(find work/cpp2il/extracted -type f -name Cpp2IL -print -quit); test -n "$exe"; chmod +x "$exe"
          NO_COLOR=true "$exe" --game-path=work/client.synthetic.apk --output-as=dll_il_recovery --output-to=work/output > work/report/cpp2il.log 2>&1
          assembly=$(find work/output -type f -name Assembly-CSharp.dll -print -quit); test -n "$assembly"
          python tools/research/extract_tw_codec_types.py --ilspy work/dotnet-tools/ilspycmd --assembly "$assembly" --out work/report/codec-types
          grep -R -n -i -E 'AES|Rijndael|Crypto|HashKey|HashSalt|CryptoKey|Serialize|Deserialize|Encode|Decode|Compress|LZ4|GZip|Deflate|MessagePack|MsgPack|RequestEncoder|Response|Decrypt|Encrypt' \
            work/report/codec-types > work/report/codec-focused.txt || true
      - name: Resolve exact runtime string slots through LibCpp2IL
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mkdir -p work/literal-query/lib
          find work/cpp2il/extracted -type f -name '*.dll' -exec cp -n '{}' work/literal-query/lib/ \;
          test -s work/literal-query/lib/LibCpp2IL.dll
          test -s work/literal-query/lib/AssetRipper.Primitives.dll
          cat > work/literal-query/LiteralQuery.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net9.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="LibCpp2IL"><HintPath>lib/LibCpp2IL.dll</HintPath><Private>true</Private></Reference>
              <Reference Include="AssetRipper.Primitives"><HintPath>lib/AssetRipper.Primitives.dll</HintPath><Private>true</Private></Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > work/literal-query/Program.cs <<'EOF'
          using System.Text.Json;
          using AssetRipper.Primitives;
          using LibCpp2IL;

          if (args.Length != 3) throw new ArgumentException("binary metadata output");
          LibCpp2IlMain.Settings.DisableMethodPointerMapping = true;
          LibCpp2IlMain.Settings.DisableGlobalResolving = false;
          LibCpp2IlMain.Settings.AllowManualMetadataAndCodeRegInput = false;
          var context = LibCpp2IlContextBuilder.Build(
              File.ReadAllBytes(args[0]),
              File.ReadAllBytes(args[1]),
              new UnityVersion(2022, 3, 62, UnityVersionType.Final, 3));
          var slots = new Dictionary<string, ulong>
          {
              ["systemMonitorOrEmpty"] = 0x9B7A4F0,
              ["msgPackDefaultCryptKey"] = 0x9BA5660,
              ["appMsgPackCryptKey"] = 0x9BCB028,
              ["appCryptoHashKeyInput"] = 0x9BCAF80,
              ["appCryptoHashSaltInput"] = 0x9BCAF88,
              ["appCryptoSeedInput"] = 0x9BCAF90,
              ["guestUserAgentHeader"] = 0x9B83D58,
              ["guestApiSuffix"] = 0x9B83D50,
              ["guestApiOrigin"] = 0x9B83D68,
              ["guestRegisterSuffix"] = 0x9B84008,
              ["guestSavedGuidKey"] = 0x9B7A538,
              ["guestSavedUuidKey"] = 0x9B831F8,
              ["guestCallbackType"] = 0x9B83FC0,
              ["sdkScheme"] = 0x9B8CAD0,
              ["sdkPackage"] = 0x9B93118,
              ["productionDomainPart"] = 0x9B8CAC0,
              ["sdkRequestSignSalt"] = 0x9C09490,
          };
          var values = slots.Select(pair => new
          {
              name = pair.Key,
              address = $"0x{pair.Value:X}",
              value = context.GetLiteralByAddress(pair.Value)
          }).ToArray();
          File.WriteAllText(args[2], JsonSerializer.Serialize(values, new JsonSerializerOptions { WriteIndented = true }));
          EOF
          set +e
          dotnet build work/literal-query/LiteralQuery.csproj --configuration Release --nologo \
            > work/report/runtime-literal-build.log 2>&1
          build_status=$?
          echo "build_status=$build_status" > work/report/runtime-literal-status.txt
          if [[ $build_status -eq 0 ]]; then
            find work/literal-query/lib -maxdepth 1 -type f -name '*.dll' -exec cp -n '{}' work/literal-query/bin/Release/net9.0/ \;
            dotnet work/literal-query/bin/Release/net9.0/LiteralQuery.dll \
              work/merged/lib/arm64-v8a/libil2cpp.so \
              work/merged/assets/bin/Data/Managed/Metadata/global-metadata.dat \
              work/report/runtime-literals.json \
              > work/report/runtime-literal-query.log 2>&1
            query_status=$?
            echo "query_status=$query_status" >> work/report/runtime-literal-status.txt
          fi
          set -e
      - name: Remove raw/full outputs
        if: ${{ always() }}
        run: |
          rm -rf work/source work/xapk work/merged work/client.synthetic.apk work/cpp2il work/output work/dotnet-tools work/literal-query
          find work/report -type f -printf '%P\t%s\n' | sort > work/report/report-inventory.tsv
      - name: Upload codec evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tw-codec-final
          path: work/report
          retention-days: 14
          if-no-files-found: error
