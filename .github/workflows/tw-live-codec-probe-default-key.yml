name: Probe Taiwan App and default MsgPack keys
run-name: Test AppMsgPack and MsgPackDefault response keys

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/tw-live-codec-probe-default-key.yml'
      - 'analysis-requests/tw-live-codec-probe-default-key.txt'

permissions:
  contents: read

concurrency:
  group: tw-live-codec-probe-default-key
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check requests msgpack pycryptodome
      - name: Test disposable login codecs
        shell: python
        run: |
          from __future__ import annotations
          import base64, hashlib, hmac, json, os, re, time, uuid
          from pathlib import Path
          from typing import Any
          import msgpack, requests
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad, unpad

          HOST='https://app-mme.so-net.tw'; APP='1.0.5'; UNITY='2022.3.62f3'
          RAW_HASH_KEY=("*0h>%iZAAdrw[R5l(S+nEmzLp?|ld5QC.n(r'$l9JhqAYl#Iq+o5xK3'9m^872WbH@uIG0~6&" "zujCBC;zigI%o..,p2ZkQAO,iLjJjW;um1c}mrCSLPJ6$WwKS$=YX:<")
          HASH_KEY=RAW_HASH_KEY[1::2]; HASH_SALT='Q?p%y):^p(N;}{5*'[1::2]; CRYPTO_SEED='a+Bb]NW?[,4]{fU='[1::2]
          RAW_KEYS={
            'app-alphanumeric':'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',
            'default-2D':'2D',
          }
          def center_bytes(value:bytes,n:int)->bytes:
            if n<=0 or len(value)<=n:return value
            i=(len(value)-n)//2; return value[i:i+n]
          def center_text(value:str,n:int)->str:
            if n<=0 or len(value)<=n:return value
            i=(len(value)-n)//2; return value[i:i+n]
          def derive(raw:str)->bytes:
            digest=hmac.new(HASH_KEY.encode(),(HASH_SALT+raw).encode(),hashlib.sha256).digest()
            return center_text(base64.b64encode(center_bytes(digest,16)).decode(),16).encode()
          KEYS={name:derive(raw) for name,raw in RAW_KEYS.items()}
          KEYS['app-crypto']=derive(CRYPTO_SEED)
          def encode(payload:dict[str,Any],client_uuid:str,key:bytes)->bytes:
            envelope={'payload':payload,'uuid':client_uuid,'userId':0,'sessionId':'','actionToken':None,'ctag':None,'actionTime':int((time.time()+11644473600)*10_000_000)}
            packed=msgpack.packb(envelope,use_bin_type=True); iv=os.urandom(16)
            return iv+AES.new(key,AES.MODE_CBC,iv).encrypt(pad(packed,16))
          def decode(raw:bytes,key:bytes)->Any:
            if len(raw)<=16 or len(raw)%16: raise ValueError(f'invalid size {len(raw)}')
            plain=unpad(AES.new(key,AES.MODE_CBC,raw[:16]).decrypt(raw[16:]),16)
            return msgpack.unpackb(plain,raw=False,strict_map_key=False)
          secret=re.compile(r'(?i)(uuid|user.?id|session|token|jwt|ctag|guid|cookie|handover)')
          def sanitize(value:Any,field:str='')->Any:
            if isinstance(value,dict): return {str(k):sanitize(v,str(k)) for k,v in value.items()}
            if isinstance(value,list): return [sanitize(v,field) for v in value[:200]]
            if secret.search(field) and value not in (None,'',0,False):
              raw=str(value).encode(); return {'present':True,'length':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
            if isinstance(value,(str,int,float,bool)) or value is None:return value
            return repr(value)[:500]
          attempts=[]; accepted=None
          for request_label in ('app-alphanumeric','default-2D'):
            client_uuid=uuid.uuid4().hex
            payload={'appVersion':APP,'urlParam':'','deviceModel':'Taiwan Codec Probe','osType':2,'osVersion':'Android 14','storeType':2,'graphicsDeviceId':0,'graphicsDeviceVendorId':0,'processorCount':8,'processorType':'arm64-v8a','supportedRenderTargetCount':4,'supports3DTextures':True,'supportsAccelerometer':True,'supportsComputeShaders':True,'supportsGyroscope':True,'supportsImageEffects':True,'supportsInstancing':True,'supportsLocationService':True,'supportsRenderTextures':True,'supportsRenderToCubemap':True,'supportsShadows':True,'supportsSparseTextures':False,'supportsStencil':1,'supportsVibration':True,'uuid':client_uuid,'xuid':0,'jwttoken':'','sm':''}
            body=encode(payload,client_uuid,KEYS[request_label])
            headers={'Accept':'*/*','Content-Type':'application/x-msgpack','x-region':'TW','x-language':'zh_TW','x-timezone-offset':'28800','x-app-version':APP,'X-GAME-SERVER-URL':HOST,'X-Unity-Version':UNITY,'X-post-signature':base64.b64encode(hashlib.sha1(body).digest()).decode()}
            response=requests.post(HOST+'/api/login',headers=headers,data=body,timeout=30); raw=response.content
            decode_results=[]; decoded=None; decoded_key=None
            for response_label,key in KEYS.items():
              try:
                decoded=decode(raw,key); decoded_key=response_label
                decode_results.append({'key':response_label,'keyText':key.decode(),'success':True}); break
              except Exception as exc:
                decode_results.append({'key':response_label,'keyText':key.decode(),'success':False,'error':type(exc).__name__+': '+str(exc)[:200]})
            item={'requestKey':request_label,'requestKeyText':KEYS[request_label].decode(),'httpStatus':response.status_code,'responseSize':len(raw),'responseSha256':hashlib.sha256(raw).hexdigest(),'first64Hex':raw[:64].hex(),'headers':{k.lower():v for k,v in response.headers.items() if k.lower().startswith('x-') or k.lower() in {'content-type','content-length'}},'decoded':decoded is not None,'decodedKey':decoded_key,'decodeResults':decode_results,'sanitizedResponse':sanitize(decoded) if decoded is not None else None}
            attempts.append(item)
            if decoded is not None: accepted=item; break
          report={'schemaVersion':1,'keys':{name:{'text':key.decode(),'sha256':hashlib.sha256(key).hexdigest()} for name,key in KEYS.items()},'accepted':accepted is not None,'acceptedRequestKey':accepted['requestKey'] if accepted else None,'acceptedResponseKey':accepted['decodedKey'] if accepted else None,'attempts':attempts}
          Path('work/report').mkdir(parents=True,exist_ok=True); Path('work/report/probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps(report,ensure_ascii=False,indent=2))
          if accepted is None: raise SystemExit('no App/default candidate decoded the response')
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tw-live-codec-probe-default-key
          path: work/report
          retention-days: 14
          if-no-files-found: error
