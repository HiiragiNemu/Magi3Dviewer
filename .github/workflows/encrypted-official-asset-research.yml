name: Encrypted official AssetBundle research bridge
run-name: Download, inspect and encrypt private official evidence

on:
  pull_request:
    branches: ['main']
    paths: ['.github/research-executor/execute.txt']

permissions:
  contents: read
  statuses: write

concurrency:
  group: encrypted-official-asset-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout one-time research executor
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install protocol dependencies
        run: python -m pip install --disable-pip-version-check requests msgpack pycryptodome

      - name: Download bounded official AssetBundle subset
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/private-evidence
          python .github/research-executor/download_targeted_assets.py \
            --out /tmp/private-evidence/source \
            > /tmp/private-evidence/downloader.log 2>&1
          status=$?
          echo "$status" > /tmp/private-evidence/downloader-exit-code.txt
          cat /tmp/private-evidence/downloader.log
          exit "$status"

      - name: Build upstream AssetStudioModCLI
        id: assetstudio
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/private-evidence
          git clone --depth 1 --branch AssetStudioMod \
            https://github.com/aelurum/AssetStudio.git /tmp/AssetStudio \
            > /tmp/private-evidence/assetstudio-clone.log 2>&1
          clone_status=$?
          if [[ $clone_status -eq 0 ]]; then
            dotnet publish /tmp/AssetStudio/AssetStudioCLI/AssetStudioCLI.csproj \
              --configuration Release \
              --framework net8.0 \
              --runtime linux-x64 \
              --self-contained false \
              -p:SolutionDir=/tmp/AssetStudio/ \
              --output /tmp/assetstudio-cli \
              > /tmp/private-evidence/assetstudio-build.log 2>&1
            build_status=$?
          else
            build_status=$clone_status
          fi
          echo "$build_status" > /tmp/private-evidence/assetstudio-exit-code.txt
          cat /tmp/private-evidence/assetstudio-clone.log 2>/dev/null || true
          cat /tmp/private-evidence/assetstudio-build.log 2>/dev/null || true
          exit "$build_status"

      - name: Dump selected Unity metadata and export official objects
        id: dump
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          input=/tmp/private-evidence/source/raw/AssetBundles
          cli=/tmp/assetstudio-cli/AssetStudioModCLI.dll
          mkdir -p /tmp/private-evidence/assetstudio-info \
                   /tmp/private-evidence/assetstudio-dump \
                   /tmp/private-evidence/stage-export \
                   /tmp/private-evidence/character-export
          if [[ ! -d "$input" || ! -f "$cli" ]]; then
            echo "input-exists=$([[ -d "$input" ]] && echo true || echo false)" \
              > /tmp/private-evidence/assetstudio-skipped.txt
            echo "cli-exists=$([[ -f "$cli" ]] && echo true || echo false)" \
              >> /tmp/private-evidence/assetstudio-skipped.txt
            exit 0
          fi

          android=$(find "$input" -type f -path '*/Android' -print -quit)
          if [[ -n "$android" ]]; then
            dotnet "$cli" "$android" -m info --unity-version 2022.3.21f1 \
              --log-output both --log-level verbose \
              > /tmp/private-evidence/assetstudio-info/android.txt 2>&1 || true
          fi

          dotnet "$cli" "$input" -m dump \
            -t monoBehaviour,shader,textAsset,material,avatar,animationClip,animatorController \
            --unity-version 2022.3.21f1 --load-all \
            -g fileName -f assetName_pathID \
            -o /tmp/private-evidence/assetstudio-dump \
            --log-output both --log-level verbose \
            > /tmp/private-evidence/assetstudio-dump.log 2>&1 || true

          # SplitObjects does not accept --load-all. Export each official stage
          # bundle independently so a single malformed dependency cannot abort the
          # other stage families.
          find "$input" -type f \( \
              -path '*/battle/stage/*' -o \
              -path '*/dungeon/bg/*' -o \
              -path '*/dungeon/level/*' -o \
              -path '*/field/bg/*' -o \
              -path '*/gallery/bg3d_gallery*' \
            \) -print0 | while IFS= read -r -d '' bundle; do
              rel=${bundle#"$input"/}
              safe=$(echo "$rel" | tr '/ ' '__')
              mkdir -p "/tmp/private-evidence/stage-export/$safe"
              dotnet "$cli" "$bundle" -m splitObjects \
                --unity-version 2022.3.21f1 \
                -o "/tmp/private-evidence/stage-export/$safe" \
                --log-output both --log-level verbose \
                > "/tmp/private-evidence/stage-export/$safe.log" 2>&1 || true
          done

          ashley="$input/battle/character/chara_110701_battle_unit"
          if [[ -f "$ashley" ]]; then
            dotnet "$cli" "$ashley" -m splitObjects \
              --unity-version 2022.3.21f1 \
              -o /tmp/private-evidence/character-export/chara_110701_battle_unit \
              --log-output both --log-level verbose \
              > /tmp/private-evidence/character-export/chara_110701_battle_unit.log 2>&1 || true
          fi

      - name: Build private evidence index
        if: ${{ always() }}
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re
          root = Path('/tmp/private-evidence')
          root.mkdir(parents=True, exist_ok=True)
          files = []
          hits = []
          terms = re.compile(r'(?i)(110701|11070101|ashley|アシュリー|redrive|angel.?ring|yuugen|face.?shadow|nose.?shadow|matcap|gem|aniso|cosmic|fresnel|rim|control.?map|specular|reDriveVolume|cinemachine|timeline|spawn|foothold)')
          for path in root.rglob('*'):
            if not path.is_file():
              continue
            h = hashlib.sha256()
            with path.open('rb') as stream:
              for block in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                h.update(block)
            files.append({'path': path.relative_to(root).as_posix(), 'size': path.stat().st_size, 'sha256': h.hexdigest()})
            if path.stat().st_size <= 64_000_000:
              try:
                text = path.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                continue
              for number, line in enumerate(text.splitlines(), 1):
                if terms.search(line):
                  hits.append({'file': path.relative_to(root).as_posix(), 'line': number, 'text': line[:2000]})
                  if len(hits) >= 50000:
                    break
            if len(hits) >= 50000:
              break
          (root / 'evidence-index.json').write_text(json.dumps({'schemaVersion': 1, 'files': files, 'hits': hits}, ensure_ascii=False, indent=2), encoding='utf-8')

      - name: Encrypt every private byte before artifact upload
        if: ${{ always() }}
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/private-evidence /tmp/encrypted-evidence
          cat > /tmp/research-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAokdxNqLzII70LvvheXAk
          PZEr1RdTkfG71Kf+6A02kgmolvl4gpLXDJm7jFvplww/4kQWje7EITEqh4ofYALe
          t5dBXJ3VDs0eKUs/tN05cTYRNRkYV9wr/94/dLAka8sSRD69qQ9oL+GbHiIUjxdp
          0ZBJqMi1GhyFLs3okTLqq6JcSgarzLJNWZBSCioYxhuhfeuo10KUIZ/6b47KFCzl
          X2Kb4QdFxS6fmhyOOcZBAHfLYVhoCQUFoRf0NNnxKcWFS+JKOC9F2nWbgkDaJjD4
          /7nNtLsKyh19i7bPTfEvlmGRm/U7lfXWghed5mPX2hgpSSCDMaGblkWXVCxaeQk3
          4aRr787InEz3MKeNTCA3YSOJLmV094YIhTkSLPfxh0/jVzVMJcVSDX3MPYm8mVUl
          5i87rFbya5JkKbeQ2CStsvCBNlA/swrNVDaRheHE3i1HGi8ejFUOf3kz+ZCY6vwf
          y4xjTcok+xhU4JqhYEe0JHBMJJL3dJpKIGvRH9X2nEXDAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C /tmp -czf /tmp/private-evidence.tar.gz private-evidence
          openssl rand -hex 32 > /tmp/evidence-password.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -pass file:/tmp/evidence-password.txt \
            -in /tmp/private-evidence.tar.gz \
            -out /tmp/encrypted-evidence/private-evidence.tar.gz.enc
          openssl pkeyutl -encrypt -pubin \
            -inkey /tmp/research-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/evidence-password.txt \
            -out /tmp/encrypted-evidence/password.rsa-oaep.enc
          sha256sum /tmp/encrypted-evidence/* > /tmp/encrypted-evidence/SHA256SUMS.txt
          echo '2afb1b8fada8c924c4bcfd4639a8d7e4d04f0f50de2a97841303cd5bf7ccfdf5  research-public.pem' \
            > /tmp/encrypted-evidence/PUBLIC_KEY_FINGERPRINT.txt
          rm -rf /tmp/private-evidence /tmp/private-evidence.tar.gz /tmp/evidence-password.txt /tmp/research-public.pem

      - name: Upload encrypted private evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-official-asset-evidence
          path: /tmp/encrypted-evidence
          retention-days: 3
          if-no-files-found: error

      - name: Publish encrypted-research status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          ASSETSTUDIO_OUTCOME: ${{ steps.assetstudio.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
        with:
          script: |
            const encrypted = process.env.ENCRYPT_OUTCOME === 'success';
            const description = encrypted
              ? `Encrypted artifact uploaded; download=${process.env.DOWNLOAD_OUTCOME}, AssetStudio=${process.env.ASSETSTUDIO_OUTCOME}`
              : 'Evidence encryption or artifact creation failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: encrypted ? 'success' : 'failure',
              context: 'Encrypted official AssetBundle research',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
