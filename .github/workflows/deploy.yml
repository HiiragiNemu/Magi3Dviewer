# Deploy the independent Magius3Dviewer build while keeping upstream source on main
name: Deploy Magius3Dviewer
run-name: Validate and deploy official-shader iteration from protected main

on:
  push:
    branches: ['main']
  workflow_dispatch:
  repository_dispatch:
    types: ['deploy-magius3dviewer']

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
  issues: write

concurrency:
  group: 'magius3dviewer-pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Magius3Dviewer source branch
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer

      - name: Resolve Magius3Dviewer revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Magius3Dviewer
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/magius-build.log

      - name: Upload build diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: magius-build-diagnostic
          path: /tmp/magius-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Install browser smoke-test driver
        if: ${{ steps.build.outcome == 'success' }}
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Run WebGL shader and stage smoke test
        if: ${{ steps.build.outcome == 'success' }}
        id: smoke
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/magius-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          sleep 4
          node scripts/smoke-magius.mjs

      - name: Upload WebGL smoke report
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: magius-webgl-smoke
          path: |
            /tmp/magius-smoke.png
            /tmp/magius-smoke-closeup.png
            /tmp/magius-smoke.json
            /tmp/magius-preview.log
          if-no-files-found: warn
          retention-days: 3

      - name: Setup Pages
        if: ${{ steps.build.outcome == 'success' && steps.smoke.outcome == 'success' }}
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        if: ${{ steps.build.outcome == 'success' && steps.smoke.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy Magius3Dviewer to GitHub Pages
        if: ${{ steps.build.outcome == 'success' && steps.smoke.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish build and deployment status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          BUILD_SHA: ${{ steps.revision.outputs.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        with:
          script: |
            const fs = require('fs');
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = process.env.BUILD_SHA || context.sha;
            const buildSucceeded = process.env.BUILD_OUTCOME === 'success';
            const smokeSucceeded = process.env.SMOKE_OUTCOME === 'success';
            const deploySucceeded = process.env.DEPLOY_OUTCOME === 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: buildSucceeded ? 'success' : 'failure',
              context: 'Magius3Dviewer production build',
              description: buildSucceeded
                ? 'npm run build completed successfully'
                : `Build outcome: ${process.env.BUILD_OUTCOME || 'unknown'}`,
              target_url: targetUrl,
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: smokeSucceeded ? 'success' : 'failure',
              context: 'Magius3Dviewer WebGL smoke test',
              description: smokeSucceeded
                ? 'Character, shader GUI, AngelRing and stages rendered in Chromium'
                : `WebGL smoke outcome: ${process.env.SMOKE_OUTCOME || 'not-run'}`,
              target_url: targetUrl,
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: deploySucceeded ? 'success' : 'failure',
              context: 'Magius3Dviewer GitHub Pages deployment',
              description: deploySucceeded
                ? 'Magius3Dviewer deployment completed successfully'
                : `Deployment outcome: ${process.env.DEPLOY_OUTCOME || 'not-run'}`,
              target_url: targetUrl,
            });

            if (!buildSucceeded) {
              let tail = 'Build log was not available.';
              try {
                const lines = fs.readFileSync('/tmp/magius-build.log', 'utf8').split(/\r?\n/);
                tail = lines.slice(-120).join('\n').slice(-55000);
              } catch (_) {}
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[automation] Magius build failure ${sha.slice(0, 8)}`,
                body: `Source revision: \`${sha}\`\n\n[Open workflow run](${targetUrl})\n\n\`\`\`text\n${tail}\n\`\`\``,
              });
            }
