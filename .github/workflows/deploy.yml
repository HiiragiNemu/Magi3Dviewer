name: Deploy Magius3Dviewer
run-name: Validate dependencies, all-character animation, Shader and stage runtime

on:
  push:
    branches: ['main']
  workflow_dispatch:
  repository_dispatch:
    types: ['deploy-magius3dviewer']

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
  issues: write

# Multiple sources may legitimately request the same release validation. Queue
# them instead of cancelling a long-running all-character/WebGL gate midway.
concurrency:
  group: magius3dviewer-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Magius3Dviewer source branch
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer

      - name: Resolve source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish pending source statuses
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
        with:
          script: |
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = process.env.SOURCE_SHA || context.sha;
            const checks = [
              ['Magius3Dviewer all-character animation audit', 'Animation audit is running'],
              ['Magius3Dviewer production build', 'Dependency audit, release tests and production build are running'],
              ['Magius3Dviewer WebGL smoke test', 'Landscape and portrait browser rendering checks are waiting'],
              ['Magius3Dviewer GitHub Pages deployment', 'Pages deployment is waiting'],
            ];
            for (const [contextName, description] of checks) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'pending',
                context: contextName,
                description,
                target_url,
              });
            }

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Audit animation families across every bundled character
        id: animation_audit
        run: |
          python scripts/audit-animation-families-v2.py \
            --root magia-exedra-character-three/models \
            --out /tmp/all-character-animation-family-audit.json \
            --minimum-models 90
          grep -q 'getAnimationFamilyName' magia-exedra-character-three/character.ts
          grep -qi 'duplicate animation bindings' magia-exedra-character-three/character.ts

      - name: Upload all-character animation audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: all-character-animation-family-audit
          path: /tmp/all-character-animation-family-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Install dependencies
        run: npm ci

      - name: Require a clean npm dependency audit
        id: dependency_audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=low 2>&1 | tee /tmp/magius-npm-audit.log

      - name: Upload npm audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: magius-npm-audit
          path: /tmp/magius-npm-audit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build Magius3Dviewer
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/magius-build.log
          if grep -q 'Some chunks are larger than' /tmp/magius-build.log; then
            echo 'Vite still reports an oversized JavaScript chunk.' >&2
            exit 1
          fi

      - name: Upload build diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: magius-build-diagnostic
          path: /tmp/magius-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Install browser smoke-test driver
        if: ${{ steps.animation_audit.outcome == 'success' && steps.dependency_audit.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Run animation, Shader, stage and AngelRing tests
        if: ${{ steps.animation_audit.outcome == 'success' && steps.dependency_audit.outcome == 'success' && steps.build.outcome == 'success' }}
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/magius-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          sleep 4
          node scripts/smoke-runtime-v2.mjs
          node scripts/smoke-angelring-two-character.mjs
          MAGIUS_VIEWPORT_WIDTH=698 \
          MAGIUS_VIEWPORT_HEIGHT=1536 \
          MAGIUS_ARTIFACT_SUFFIX=portrait \
            node scripts/smoke-angelring-two-character.mjs

      - name: Upload WebGL smoke evidence
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: magius-webgl-smoke
          path: |
            /tmp/magius-smoke.png
            /tmp/magius-smoke-ashley.png
            /tmp/magius-smoke-closeup.png
            /tmp/magius-smoke.json
            /tmp/magius-angelring-madoka-front.png
            /tmp/magius-angelring-madoka-back.png
            /tmp/magius-angelring-ashley-front.png
            /tmp/magius-angelring-ashley-back.png
            /tmp/magius-angelring-two-character.json
            /tmp/magius-angelring-madoka-front-portrait.png
            /tmp/magius-angelring-madoka-back-portrait.png
            /tmp/magius-angelring-ashley-front-portrait.png
            /tmp/magius-angelring-ashley-back-portrait.png
            /tmp/magius-angelring-two-character-portrait.json
            /tmp/magius-preview.log
          if-no-files-found: warn
          retention-days: 3

      - name: Setup Pages
        if: ${{ steps.animation_audit.outcome == 'success' && steps.dependency_audit.outcome == 'success' && steps.build.outcome == 'success' && steps.smoke.outcome == 'success' }}
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        if: ${{ steps.animation_audit.outcome == 'success' && steps.dependency_audit.outcome == 'success' && steps.build.outcome == 'success' && steps.smoke.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy Magius3Dviewer
        if: ${{ steps.animation_audit.outcome == 'success' && steps.dependency_audit.outcome == 'success' && steps.build.outcome == 'success' && steps.smoke.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish commit statuses
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          ANIMATION: ${{ steps.animation_audit.outcome }}
          AUDIT: ${{ steps.dependency_audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          DEPLOY: ${{ steps.deployment.outcome }}
        with:
          script: |
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = process.env.SOURCE_SHA || context.sha;
            const productionOutcome = process.env.AUDIT === 'success' && process.env.BUILD === 'success'
              ? 'success'
              : 'failure';
            const checks = [
              ['Magius3Dviewer all-character animation audit', process.env.ANIMATION, 'All FBX animation families parsed and generic binding correction verified'],
              ['Magius3Dviewer production build', productionOutcome, 'Zero npm audit findings; release tests and chunked production build completed'],
              ['Magius3Dviewer WebGL smoke test', process.env.SMOKE, 'Madoka/Ashley AngelRing rendered correctly in landscape and phone portrait viewports'],
              ['Magius3Dviewer GitHub Pages deployment', process.env.DEPLOY, 'Magius3Dviewer deployed'],
            ];
            for (const [contextName, outcome, successText] of checks) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: contextName,
                description: outcome === 'success' ? successText : `Outcome: ${outcome || 'not-run'}`,
                target_url,
              });
            }
