name: Validate modular generated scene corpus

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-modular-scene-corpus.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feature/modular-scene-corpus-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Apply recursive catalog integration
        run: |
          python scripts/apply_modular_scene_corpus_patch.py
          python scripts/register_generated_scene_corpus.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Persist validated generated-corpus integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/viewer/stages.ts public/stages/catalog.json package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: load recursive generated JP/TW scene catalogs'
          git push origin HEAD:${TARGET_BRANCH}
