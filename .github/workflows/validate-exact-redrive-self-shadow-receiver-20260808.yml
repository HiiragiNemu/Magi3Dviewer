name: Validate exact ReDrive self-shadow receiver

on:
  push:
    branches:
      - feature/exact-redrive-self-shadow-receiver-20260808
    paths:
      - automation/trigger-exact-redrive-self-shadow-receiver-20260808.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/exact-redrive-self-shadow-receiver-20260808
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Gate exact receiver and existing self-shadow architecture
        run: |
          node --test exactSelfShadowReceiver.test.mjs
          node --test nativeSelfShadow.test.mjs
      - name: Gate current character material formula ports
        run: node exactReDriveFormulaParity.test.mjs
      - name: Production build
        run: npm run build
