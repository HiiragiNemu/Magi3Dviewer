name: Inspect Madoka official hair textures

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/inspect-madoka-hair-textures.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Magius3Dviewer source
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer

      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build channel statistics and previews
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import json, statistics

          root = Path('magia-exedra-character-three/models/chara_100107_battle_unit')
          selected = []
          for pattern in ('*hair*color*.png', '*hair*shadow*.png', '*hair*ctrl*.png'):
              matches = sorted(root.glob(pattern))
              if not matches:
                  raise SystemExit(f'No texture matched {pattern}; available={sorted(x.name for x in root.glob("*.png"))}')
              selected.append(matches[0])
          paths = selected + [Path('magia-exedra-character-three/shaders/RDToon_AngelRingMap.png')]
          out = Path('/tmp/madoka-hair-textures')
          out.mkdir(parents=True, exist_ok=True)
          reports = []
          panels = []
          for path in paths:
              image = Image.open(path).convert('RGBA')
              channels = image.split()
              channel_stats = {}
              for label, channel in zip('RGBA', channels):
                  values = list(channel.getdata())
                  channel_stats[label] = {
                      'min': min(values),
                      'max': max(values),
                      'mean': statistics.fmean(values),
                      'nonzero': sum(value > 0 for value in values),
                      'nearWhite': sum(value >= 245 for value in values),
                  }
                  preview = ImageOps.autocontrast(channel).convert('RGB').resize((384, 384))
                  draw = ImageDraw.Draw(preview)
                  draw.rectangle((0, 0, 384, 28), fill='black')
                  draw.text((8, 7), f'{path.name} / {label}', fill='white')
                  panels.append(preview)
              image.resize((384, 384)).save(out / path.name)
              reports.append({
                  'file': path.as_posix(),
                  'size': image.size,
                  'channels': channel_stats,
              })
          sheet = Image.new('RGB', (384 * 4, 384 * len(paths)), 'black')
          for index, panel in enumerate(panels):
              sheet.paste(panel, ((index % 4) * 384, (index // 4) * 384))
          sheet.save(out / 'channel-contact-sheet.jpg', quality=94)
          (out / 'texture-report.json').write_text(json.dumps(reports, indent=2), encoding='utf-8')

      - name: Upload Madoka hair texture inspection
        uses: actions/upload-artifact@v4
        with:
          name: madoka-hair-texture-inspection
          path: /tmp/madoka-hair-textures
          retention-days: 7

      - name: Publish status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const status='${{ job.status }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status === 'success' ? 'success' : 'failure',
              context: 'Madoka hair texture inspection',
              description: status === 'success' ? 'Hair texture channels inspected' : 'Hair texture inspection failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
