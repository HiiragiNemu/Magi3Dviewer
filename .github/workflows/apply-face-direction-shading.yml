name: Apply Head-direction face shading
run-name: Wire official face profiles and animated Head axes into Face material

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['.github/workflows/apply-face-direction-shading.yml']

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-head-direction-face-shading
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Magius3Dviewer
        uses: actions/checkout@v5
        with:
          ref: magius3dviewer
          fetch-depth: 0

      - name: Patch Face material creation structurally
        shell: python
        run: |
          from pathlib import Path

          path=Path('magia-exedra-character-three/loader.ts')
          text=path.read_text(encoding='utf-8')
          anchor="import {\n    getOfficialMaterialProfiles,\n    type OfficialMaterialProfile,\n} from './materialProfile';\n"
          face_import="import { createFaceDirectionReference, getOfficialFaceProfile } from './faceProfile';\n"
          if face_import not in text:
            if anchor not in text: raise SystemExit('loader material-profile import anchor missing')
            text=text.replace(anchor,anchor+face_import,1)

          if 'Official face profile/reference:' not in text:
            start=text.index("                    if (name.includes('face')) {")
            end=text.index("                    } else {\n                        let alphaSrc", start)
            replacement='''                    if (name.includes('face')) {
                        const faceProfile = getOfficialFaceProfile(characterId)
                        const faceReference = createFaceDirectionReference(modelObject, characterProfile)
                        const result = await createFaceMaterial({
                            ...sharedMaterialOptions,
                            shadowMap: shadowMap!,
                            eyehighlightMap: ObjFindByKey(texturePathUrl, path => path.includes('eye'))!,
                            faceProfile,
                            faceReference,
                        })
                        material = result.material
                        textures = result.textures
                        if (result.updateFaceDirectionReference) {
                            userData.animationLoops.push(result.updateFaceDirectionReference)
                        }
                        console.log('Official face profile/reference:', faceProfile, faceReference)
          '''
            text=text[:start]+replacement+text[end:]
          path.write_text(text,encoding='utf-8')

      - name: Validate Face integration
        run: |
          grep -F "from './faceProfile'" magia-exedra-character-three/loader.ts
          grep -F "Official face profile/reference" magia-exedra-character-three/loader.ts
          grep -F "faceProfile," magia-exedra-character-three/loader.ts
          grep -F "faceReference," magia-exedra-character-three/loader.ts

      - name: Commit and push face runtime integration
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add magia-exedra-character-three/loader.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(face): bind official profiles and animated Head axes'
            git push origin HEAD:magius3dviewer
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const status='${{ job.status }}';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:process.env.SOURCE_SHA||context.sha,state:status==='success'?'success':'failure',context:'Official Head-direction face shading',description:status==='success'?'Face SDF profiles wired':'Face runtime integration failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
