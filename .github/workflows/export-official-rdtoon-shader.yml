name: Export official ReDriveToon Shader assets
run-name: Export ShaderLab and compiled ReDriveToon shader payloads

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/export-official-rdtoon-shader.yml'
      - '.github/shader-export-trigger.txt'

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: export-official-rdtoon-shader
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout official downloader executor
        uses: actions/checkout@v5
        with:
          ref: automation/encrypted-official-assets
          path: research

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install protocol dependencies
        run: python -m pip install --disable-pip-version-check requests msgpack pycryptodome

      - name: Download root Android and Shader bundles
        run: |
          python research/.github/research-executor/download_targeted_assets.py \
            --out /tmp/official-source

      - name: Build AssetStudioModCLI
        run: |
          git clone --depth 1 --branch AssetStudioMod \
            https://github.com/aelurum/AssetStudio.git /tmp/AssetStudio
          dotnet publish /tmp/AssetStudio/AssetStudioCLI/AssetStudioCLI.csproj \
            --configuration Release \
            --framework net8.0 \
            --runtime linux-x64 \
            --self-contained false \
            -p:SolutionDir=/tmp/AssetStudio/ \
            --output /tmp/assetstudio-cli

      - name: Record CLI command schema
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/shader-export/logs
          dotnet /tmp/assetstudio-cli/AssetStudioModCLI.dll --help \
            > /tmp/shader-export/logs/help.txt 2>&1
          dotnet /tmp/assetstudio-cli/AssetStudioModCLI.dll \
            > /tmp/shader-export/logs/no-args.txt 2>&1
          true

      - name: Export Shader assets through every supported representation
        shell: bash
        run: |
          set +e
          input=/tmp/official-source/raw/AssetBundles
          mkdir -p /tmp/shader-export/export /tmp/shader-export/raw /tmp/shader-export/dump

          dotnet /tmp/assetstudio-cli/AssetStudioModCLI.dll \
            "$input" -m export -t shader \
            --unity-version 2022.3.21f1 --load-all \
            -g fileName -f assetName_pathID \
            -o /tmp/shader-export/export \
            --log-output both --log-level verbose \
            > /tmp/shader-export/logs/export.txt 2>&1
          echo $? > /tmp/shader-export/logs/export.exit

          dotnet /tmp/assetstudio-cli/AssetStudioModCLI.dll \
            "$input" -m raw -t shader \
            --unity-version 2022.3.21f1 --load-all \
            -g fileName -f assetName_pathID \
            -o /tmp/shader-export/raw \
            --log-output both --log-level verbose \
            > /tmp/shader-export/logs/raw.txt 2>&1
          echo $? > /tmp/shader-export/logs/raw.exit

          dotnet /tmp/assetstudio-cli/AssetStudioModCLI.dll \
            "$input" -m dump -t shader \
            --unity-version 2022.3.21f1 --load-all \
            -g fileName -f assetName_pathID \
            -o /tmp/shader-export/dump \
            --log-output both --log-level verbose \
            > /tmp/shader-export/logs/dump.txt 2>&1
          echo $? > /tmp/shader-export/logs/dump.exit
          true

      - name: Sanitize and index exported Shader corpus
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,re,shutil
          root=Path('/tmp/shader-export')
          out=Path('/tmp/sanitized-shader-export');out.mkdir(parents=True,exist_ok=True)
          secret=re.compile(r'(?i)(token|signature|crypto.?key|akamai).{0,64}[:=].*')
          query=re.compile(r'https?://\S+\?\S+')
          shader_terms=re.compile(r'(?i)(redrive|rdtoon|angel.?ring|yuugen|self.?shadow|face.?gradient|specular.?gradient|depth.?tex|gem|cosmic|aniso|outline)')
          manifest=[];hits=[]
          for area in ('export','raw','dump','logs'):
            source=root/area
            if not source.exists():continue
            for path in source.rglob('*'):
              if not path.is_file():continue
              rel=Path(area)/path.relative_to(source)
              data=path.read_bytes()
              # Exported Shader assets are textual on supported Unity formats;
              # preserve unknown binary Shader blobs in the private artifact as
              # hexadecimal metadata only, never publish arbitrary raw bundles.
              try:text=data.decode('utf-8')
              except UnicodeDecodeError:
                record={'path':rel.as_posix(),'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'binary':True,'magic':data[:64].hex()}
                manifest.append(record)
                continue
              safe='\n'.join(query.sub('[REDACTED URL QUERY]',secret.sub('[REDACTED SECRET FIELD]',line)) for line in text.splitlines())+'\n'
              target=out/rel;target.parent.mkdir(parents=True,exist_ok=True);target.write_text(safe,encoding='utf-8')
              manifest.append({'path':rel.as_posix(),'size':len(safe.encode()),'sha256':hashlib.sha256(safe.encode()).hexdigest(),'binary':False})
              for no,line in enumerate(safe.splitlines(),1):
                if shader_terms.search(line):
                  hits.append({'file':rel.as_posix(),'line':no,'text':line[:4000]})
                  if len(hits)>=200000:break
          index={'schemaVersion':1,'fileCount':len(manifest),'textFileCount':sum(not x.get('binary') for x in manifest),'binaryFileCount':sum(bool(x.get('binary')) for x in manifest),'files':manifest,'hits':hits}
          (out/'shader-export-index.json').write_text(json.dumps(index,ensure_ascii=False,indent=2),encoding='utf-8')
          if not manifest:raise SystemExit('No Shader export diagnostics produced')

      - name: Delete downloaded proprietary AssetBundles
        if: ${{ always() }}
        run: rm -rf /tmp/official-source /tmp/AssetStudio /tmp/assetstudio-cli

      - name: Upload sanitized Shader export and command diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: official-rdtoon-shader-export
          path: /tmp/sanitized-shader-export
          retention-days: 7
          if-no-files-found: error

      - name: Publish export status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const status='${{ job.status }}';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:status==='success'?'success':'failure',context:'Official ReDriveToon Shader asset export',description:status==='success'?'Shader export representations generated':'Shader export failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
