name: Validate exact stage hierarchy anchors

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'automation/trigger-stage-hierarchy-anchors.txt'

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feature/stage-hierarchy-anchors-20260807
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - run: python scripts/apply_stage_hierarchy_anchor_patch.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Persist validated hierarchy anchors
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/viewer/stages.ts package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: bind recovered stage components by exact hierarchy path'
          git push origin HEAD:${TARGET_BRANCH}
