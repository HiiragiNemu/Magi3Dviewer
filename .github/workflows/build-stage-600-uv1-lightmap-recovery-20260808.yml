name: Build stage 600 UV1 lightmap recovery

on:
  push:
    branches:
      - feature/stage-600-uv1-lightmap-recovery-20260808
    paths:
      - automation/trigger-stage-600-uv1-lightmap-recovery-20260808.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/stage-600-uv1-lightmap-recovery-20260808
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install product dependencies
        run: npm ci
      - name: Materialize exact current-JP UV1 research tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/stage-600-01-02-current-jp-20260808
          rm -rf /tmp/stage600-research
          git worktree add --detach \
            /tmp/stage600-research \
            origin/research/stage-600-01-02-current-jp-20260808
      - name: Install extractor dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install requests msgpack pycryptodome UnityPy lz4
          cd /tmp/stage600-research
          npm ci
      - name: Regenerate exact 158-node UV1 companion from current JP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/stage600-research
          export STAGE600_UV1_SOURCE_OUT=/tmp/stage600-uv1-source.json
          export STAGE600_MESHFILTER_HIERARCHY_OUT=/tmp/stage600-meshfilter-hierarchy.json
          export STAGE600_UV1_COMPANION_OUT=/tmp/stage600-uv1-companion-expanded.json
          python scripts/extract_stage_600_uv1_source.py
          python scripts/extract_stage_600_meshfilter_hierarchy.py
          node scripts/build_stage_600_uv1_companion.mjs
          cd "$GITHUB_WORKSPACE"
          node scripts/compact_stage_600_uv1_companion.mjs \
            /tmp/stage600-uv1-companion-expanded.json \
            public/stages/official/battle-600-00-01-002/uv1-companion.json
      - name: Apply fail-closed runtime integration
        run: python scripts/apply_stage_600_uv1_runtime.py
      - name: Gate exact UV1 companion and baked-lightmap runtime
        run: |
          node --test stage600Uv1Companion.test.mjs
          node --test stageLightmaps.test.mjs
      - name: Gate previously shipped P0 corrections
        run: |
          node --test stage608Flipbook.test.mjs
          node --test stage608ExactRenderState.test.mjs
          node exactReDriveFormulaParity.test.mjs
          node --test nativeSelfShadow.test.mjs
      - name: Production build
        run: npm run build
      - name: Persist validated stage 600 product fix
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -s public/stages/official/battle-600-00-01-002/uv1-companion.json
          git add \
            src/viewer/stages.ts \
            public/stages/catalog.json \
            public/stages/official/battle-600-00-01-002/uv1-companion.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: restore current-JP stage 600 baked-lightmap UV1'
          git push origin HEAD:feature/stage-600-uv1-lightmap-recovery-20260808
