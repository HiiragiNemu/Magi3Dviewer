name: Request Magius3Dviewer deployment

on:
  push:
    branches: ['magius3dviewer']

permissions:
  contents: write
  statuses: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request protected-main deployment
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'deploy-magius3dviewer',
                client_payload: {
                  source_branch: context.ref.replace('refs/heads/', ''),
                  source_sha: context.sha,
                },
              });
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'success',
                context: 'Magius3Dviewer deployment request',
                description: 'Protected-main Pages deployment requested',
                target_url: targetUrl,
              });
            } catch (error) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                context: 'Magius3Dviewer deployment request',
                description: 'Could not request protected-main deployment',
                target_url: targetUrl,
              });
              throw error;
            }
